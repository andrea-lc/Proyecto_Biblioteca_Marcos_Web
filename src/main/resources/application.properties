spring.datasource.url=jdbc:mysql://localhost:3306/gestion_biblioteca
spring.datasource.username=root

spring.datasource.password=123456


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El secreto debe tener MÍNIMO 32 caracteres (HS256 lo exige)
jwt.secret=${JWT_SECRET:bibliot-secreto-desarrollo-cambiar-en-produccion-2026}
# Una hora de vida de token para pruebas
jwt.expiration-ms=3600000

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true