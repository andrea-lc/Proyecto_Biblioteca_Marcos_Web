spring.datasource.url=jdbc:mysql://localhost:3306/gestion_biblioteca
spring.datasource.username=root
spring.datasource.password=Ticona17

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El secreto debe tener MÍNIMO 32 caracteres (HS256 lo exige)
jwt.secret=${JWT_SECRET:bibliot-secreto-desarrollo-cambiar-en-produccion-2026}
# Una hora de vida de token para pruebas
jwt.expiration-ms=36000000000000000

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Archivo local de portadas y libros digitales (puede reemplazarse con BIBLIOT_STORAGE_PATH)
bibliot.storage.location=${BIBLIOT_STORAGE_PATH:./storage/uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=56MB

# Índice full-text local de Lucene; Hibernate Search se integra con el ORM administrado por Spring Boot.
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=${user.dir}/storage/lucene-index
spring.jpa.properties.hibernate.search.backend.analysis.configurer=class:com.bibliot.gestion_biblioteca.config.SpanishAnalysisConfigurer
spring.jpa.properties.hibernate.search.indexing.plan.synchronization.strategy=read-sync
bibliot.search.reindex-on-startup=true

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.datasource.hikari.leak-detection-threshold=30000

# Plazo de devolución por defecto (en días) contado desde la entrega física del libro
bibliot.prestamo.dias-plazo=14
server.error.include-message=always
