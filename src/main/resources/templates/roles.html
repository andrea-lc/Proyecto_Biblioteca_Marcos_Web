<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <script th:replace="~{auth :: auth}"></script>
    <title>Roles | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,add,admin_panel_settings,business,edit_note,groups,home,logout,menu_book,notifications,query_stats,search,settings,swap_horiz" />
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside th:replace="~{admin-sidebar :: sidebar('usuarios')}" class="admin-sidebar"></aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <form class="admin-search" id="role-search-form" role="search">
                    <span class="material-symbols-outlined" aria-hidden="true">search</span>
                    <input id="role-search" type="search" placeholder="Buscar rol" aria-label="Buscar rol">
                </form>
                <div class="topbar-actions">
                    <button class="round-action" type="button" aria-label="Notificaciones">
                        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                    </button>
                    <a class="round-action user-action" th:href="@{/perfil}" aria-label="Mi cuenta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                    </a>
                </div>
            </header>

            <section class="users-content" aria-labelledby="roles-title">
                <nav class="user-tabs ed-tabs" aria-label="Secciones de usuarios">
                    <a th:href="@{/usuarios}">Todos los usuarios</a>
                    <a class="selected" th:href="@{/roles}" aria-current="page">Roles</a>
                </nav>
                <div class="users-heading-row ed-enter">
                    <h1 class="page-heading" id="roles-title">Roles y permisos <span class="users-total ed-count-pill"><b id="role-count">0</b></span></h1>
                    <div class="users-actions">
                        <button data-roles="ADMINISTRADOR" class="btn btn-brand btn-sm" id="role-new" type="button">
                            <span class="material-symbols-outlined" aria-hidden="true">add</span>Nuevo rol
                        </button>
                    </div>
                </div>

                <div class="alert alert-info ed-notice py-2 small mb-3" id="roles-message" role="status" aria-live="polite">Cargando roles…</div>

                <section data-roles="ADMINISTRADOR" class="card ed-card mb-4 ed-enter" data-stagger="1" aria-labelledby="role-form-title">
                    <div class="card-body p-3 p-md-4">
                        <h2 class="ed-card-title mb-3" id="role-form-title">Crear rol</h2>
                        <form id="role-form" novalidate>
                            <input id="role-id" type="hidden">
                            <div class="row g-3 align-items-end">
                                <div class="col-12 col-md">
                                    <label class="form-label" for="role-name">Nombre del rol <span class="text-danger">*</span></label>
                                    <input class="form-control" id="role-name" type="text" maxlength="50" required autocomplete="off" aria-describedby="role-name-help">
                                    <div class="form-text" id="role-name-help">Máximo 50 caracteres.</div>
                                    <div class="invalid-feedback">Escribe un nombre para el rol.</div>
                                </div>
                                <div class="col-12 col-md-auto d-flex flex-wrap gap-2">
                                    <button class="btn btn-sand" id="role-save" type="submit">
                                        <span class="spinner-border spinner-border-sm me-2" id="role-save-spinner" aria-hidden="true" hidden></span>
                                        <span id="role-save-label">Crear rol</span>
                                    </button>
                                    <button class="btn btn-outline-secondary" id="role-cancel" type="button" hidden>Cancelar edición</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <div class="table-responsive users-table-wrap ed-table-wrap ed-enter" data-stagger="2" tabindex="0" role="region" aria-labelledby="roles-title">
                    <table class="table users-table ed-table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre del rol</th>
                                <th data-roles="ADMINISTRADOR" class="text-end" scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="roles-body">
                            <tr><td colspan="3" class="py-3"><span class="ed-skeleton ed-skeleton--row" aria-hidden="true"></span></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="alert alert-warning mt-3 mb-0" role="note">
                    La entidad actual solo registra nombres de roles. La asignación de permisos queda pendiente de la definición institucional.
                </div>
            </section>
        </main>
    </div>

    <script th:inline="javascript">
        const canManageRoles = Auth.hasRole(['ADMINISTRADOR']);
        const rolesColumnCount = canManageRoles ? 3 : 2;
        const apiRolesUrl = canManageRoles
            ? /*[[@{/api/admin/roles}]]*/ '/api/admin/roles'
            : /*[[@{/api/bibliotecario/roles}]]*/ '/api/bibliotecario/roles';
        const formRole = document.getElementById('role-form');
        const roleId = document.getElementById('role-id');
        const roleName = document.getElementById('role-name');
        const rolesBody = document.getElementById('roles-body');
        const rolesMessage = document.getElementById('roles-message');
        const totalRoles = document.getElementById('role-count');
        const roleSearchForm = document.getElementById('role-search-form');
        const roleSearch = document.getElementById('role-search');
        const newRoleButton = document.getElementById('role-new');
        const saveButton = document.getElementById('role-save');
        const saveLabel = document.getElementById('role-save-label');
        const saveSpinner = document.getElementById('role-save-spinner');
        const cancelButton = document.getElementById('role-cancel');
        const roleFormTitle = document.getElementById('role-form-title');
        let roles = [];

        function mensaje(texto, tipo = 'info') {
            rolesMessage.hidden = false;
            rolesMessage.className = `alert alert-${tipo} py-2 small mb-3`;
            rolesMessage.textContent = texto;
        }

        function limpiarFormulario() {
            formRole.reset();
            formRole.classList.remove('was-validated');
            roleId.value = '';
            roleName.setCustomValidity('');
            roleFormTitle.textContent = 'Crear rol';
            saveLabel.textContent = 'Crear rol';
            cancelButton.hidden = true;
        }

        function crearCelda(texto, clase = '') {
            const celda = document.createElement('td');
            if (clase) celda.className = clase;
            celda.textContent = texto;
            return celda;
        }

        function dibujarRoles() {
            const termino = roleSearch.value.trim().toLocaleLowerCase();
            const filtrados = roles.filter(rol => `${rol.idRol} ${rol.nombre}`.toLocaleLowerCase().includes(termino));
            rolesBody.replaceChildren();
            totalRoles.textContent = filtrados.length;

            if (filtrados.length === 0) {
                const fila = document.createElement('tr');
                const celda = crearCelda(
                    termino ? 'No se encontraron roles que coincidan con la búsqueda.' : 'Aún no hay roles registrados.',
                    'text-center text-secondary py-4'
                );
                celda.colSpan = rolesColumnCount;
                fila.append(celda);
                rolesBody.append(fila);
                return;
            }

            filtrados.forEach(rol => {
                const fila = document.createElement('tr');
                fila.append(crearCelda(`#${rol.idRol}`, 'employee-id'));
                fila.append(crearCelda(rol.nombre));

                if (canManageRoles) {
                const acciones = document.createElement('td');
                acciones.className = 'text-end';
                const botones = document.createElement('div');
                botones.className = 'ed-row-actions flex-wrap';

                const editar = document.createElement('button');
                editar.type = 'button';
                editar.className = 'btn btn-sm btn-outline-secondary';
                editar.textContent = 'Editar';
                editar.setAttribute('aria-label', `Editar rol ${rol.nombre}`);
                editar.addEventListener('click', () => {
                    roleId.value = rol.idRol;
                    roleName.value = rol.nombre;
                    roleName.setCustomValidity('');
                    formRole.classList.remove('was-validated');
                    roleFormTitle.textContent = 'Editar rol';
                    saveLabel.textContent = 'Guardar cambios';
                    cancelButton.hidden = false;
                    formRole.scrollIntoView({ block: 'center' });
                    roleName.focus();
                });

                const eliminar = document.createElement('button');
                eliminar.type = 'button';
                eliminar.className = 'btn btn-sm btn-outline-danger';
                eliminar.textContent = 'Eliminar';
                eliminar.setAttribute('aria-label', `Eliminar rol ${rol.nombre}`);
                eliminar.addEventListener('click', () => eliminarRol(rol, eliminar));

                botones.append(editar, eliminar);
                acciones.append(botones);
                fila.append(acciones);
                }
                rolesBody.append(fila);
            });
        }

        async function mensajeErrorApi(respuesta) {
            const texto = await respuesta.text();
            if (!texto) return `Error HTTP ${respuesta.status}.`;
            try {
                const detalle = JSON.parse(texto);
                return detalle.message || detalle.detail || detalle.error || texto;
            } catch (_) {
                return texto.trim().startsWith('<')
                    ? `Error HTTP ${respuesta.status}. Revisa los datos e inténtalo nuevamente.`
                    : texto;
            }
        }

        async function cargarRoles() {
            mensaje('Cargando roles…');
            try {
                const response = await fetch(apiRolesUrl, { headers: { Accept: 'application/json' } });
                if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
                roles = await response.json();
                dibujarRoles();
                rolesMessage.hidden = true;
                return true;
            } catch (error) {
                mensaje(`No se pudieron cargar los roles. ${error.message}`, 'danger');
                return false;
            }
        }

        async function eliminarRol(rol, boton) {
            if (!window.confirm(`¿Eliminar el rol “${rol.nombre}”?`)) return;
            boton.disabled = true;
            boton.textContent = 'Eliminando…';
            try {
                const response = await fetch(`${apiRolesUrl}/${encodeURIComponent(rol.idRol)}`, { method: 'DELETE' });
                if (!response.ok) throw new Error(await mensajeErrorApi(response));
                if (await cargarRoles()) mensaje(`Rol “${rol.nombre}” eliminado.`, 'success');
            } catch (error) {
                mensaje(`No se pudo eliminar el rol. ${error.message}`, 'danger');
                if (boton.isConnected) {
                    boton.disabled = false;
                    boton.textContent = 'Eliminar';
                }
            }
        }

        roleName.addEventListener('input', () => roleName.setCustomValidity(''));
        roleSearchForm.addEventListener('submit', event => event.preventDefault());
        newRoleButton.addEventListener('click', () => {
            limpiarFormulario();
            formRole.scrollIntoView({ block: 'center' });
            roleName.focus();
        });
        roleSearch.addEventListener('input', dibujarRoles);

        formRole.addEventListener('submit', async event => {
            event.preventDefault();
            roleName.setCustomValidity(roleName.value.trim() ? '' : 'Escribe un nombre para el rol.');
            formRole.classList.add('was-validated');
            if (!formRole.checkValidity()) {
                formRole.reportValidity();
                return;
            }

            const id = roleId.value;
            const estabaEditando = Boolean(id);
            saveButton.disabled = true;
            cancelButton.disabled = true;
            newRoleButton.disabled = true;
            roleName.disabled = true;
            saveButton.setAttribute('aria-busy', 'true');
            saveSpinner.hidden = false;
            saveLabel.textContent = 'Guardando…';
            mensaje('Guardando rol…');

            try {
                const response = await fetch(id ? `${apiRolesUrl}/${encodeURIComponent(id)}` : apiRolesUrl, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({ idRol: id ? Number(id) : null, nombre: roleName.value.trim() })
                });
                if (!response.ok) throw new Error(await mensajeErrorApi(response));

                limpiarFormulario();
                if (await cargarRoles()) mensaje(estabaEditando ? 'Rol actualizado.' : 'Rol creado.', 'success');
            } catch (error) {
                mensaje(`No se pudo guardar el rol. ${error.message}`, 'danger');
            } finally {
                saveButton.disabled = false;
                cancelButton.disabled = false;
                newRoleButton.disabled = false;
                roleName.disabled = false;
                saveButton.removeAttribute('aria-busy');
                saveSpinner.hidden = true;
                saveLabel.textContent = roleId.value ? 'Guardar cambios' : 'Crear rol';
            }
        });

        cancelButton.addEventListener('click', limpiarFormulario);
        cargarRoles();
    </script>
</body>

</html>
