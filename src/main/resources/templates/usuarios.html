<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Usuarios | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=notifications,account_circle,groups" />
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a class="admin-brand" th:href="@{/dashboard}">Bibliot.</a>
            <nav class="admin-nav" aria-label="Navegación principal">
                <a th:href="@{/roles}"><span class="nav-icon">▱</span>Roles</a>
                <a class="active" th:href="@{/usuarios}" aria-current="page"><span class="nav-icon"><span
                            class="material-symbols-outlined">groups</span></span>Usuarios</a>
                <a th:href="@{/libros}"><span class="nav-icon">▤</span>Libros</a>
                <a th:href="@{/dashboard}"><span class="nav-icon">◷</span>Reportes</a>
                <a th:href="@{/configuracion}"><span class="nav-icon">⚙</span>Ajustes</a>
            </nav>
            <a class="signout-link" th:href="@{/login}">↪ <span>Cerrar sesión</span></a>
        </aside>
        <main class="admin-main">
            <header class="admin-topbar">
                <form class="admin-search" role="search" th:action="@{/usuarios}" method="get"><span
                        aria-hidden="true">⌕</span><input type="search" name="q" placeholder="Buscar"
                        aria-label="Buscar"></form>
                <div class="topbar-actions"><button class="round-action" type="button" aria-label="Notificaciones"><span
                            class="material-symbols-outlined">notifications</span></button><button
                        class="round-action user-action" type="button" aria-label="Perfil"><span
                            class="material-symbols-outlined">account_circle</span></button></div>
            </header>
            <section class="users-content">
                <div class="users-heading-row">
                    <div>
                        <h1 class="page-heading mb-1">Usuarios <span class="users-total">ⓘ <b id="user-count">0</b></span></h1>
                    </div>
                    <div class="users-actions"><button class="btn btn-outline-secondary btn-sm" type="button" disabled>⇩
                            Exportar</button><a class="btn btn-brand btn-sm" th:href="@{/usuarios/nuevo}">＋ Nuevo usuario</a>
                    </div>
                </div>
                <div class="alert alert-info" id="users-message" role="status">Listado de muestra. Exportación, filtros y cambio de vista todavía no están conectados.</div>
                <div class="user-tabs"><a class="selected" th:href="@{/usuarios}">Todos</a><a th:href="@{/roles}">Roles</a></div>
                <div class="user-toolbar">
                    <form class="user-search" th:action="@{/usuarios}" method="get"><span
                            aria-hidden="true">⌕</span><input type="search" name="usuario" placeholder="Buscar usuario"
                            aria-label="Buscar usuario"></form>
                    <div class="table-tools"><button class="btn btn-outline-secondary btn-sm" type="button" disabled>☷
                            <span>Filtrar</span></button><button class="view-toggle active" type="button"
                            aria-label="Vista de lista" disabled>☷</button><button class="view-toggle" type="button" disabled
                            aria-label="Vista de tarjetas">▦</button></div>
                </div>
                <div class="table-responsive users-table-wrap">
                    <table class="table users-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="check-col"><input type="checkbox" aria-label="Seleccionar todos"></th>
                                <th>Nombre</th>
                                <th>Empleado ID</th>
                                <th>Rol <span class="text-muted">ⓘ</span></th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                    <nav class="users-pagination" aria-label="Paginación"><button class="page-btn" type="button" disabled>←
                            <span>Anteriores</span></button>
                        <div class="page-numbers"><button class="current" type="button" disabled>1</button><button
                                type="button" disabled>2</button><button type="button" disabled>3</button><span>…</span><button
                                type="button" disabled>8</button><button type="button" disabled>9</button><button
                                type="button" disabled>10</button></div><button class="page-btn"
                            type="button" disabled><span>Siguiente</span> →</button>
                    </nav>
                </div>
            </section>
        </main>
    </div>
<script th:inline="javascript">
const usersApi = /*[[@{/api/admin/usuarios}]]*/ "/api/admin/usuarios";
const body = document.getElementById("users-table-body");
const notice = document.getElementById("users-message");
const count = document.getElementById("user-count");
let allUsers = [];
function renderUsers(query = "") {
 const q = query.trim().toLowerCase();
 const matches = allUsers.filter(user => `${user.nombres} ${user.apellidos} ${user.email} ${user.rol || ""} ${user.idUsuario}`.toLowerCase().includes(q));
 body.replaceChildren(); count.textContent = allUsers.length;
 matches.forEach((user, index) => {
  const row = document.createElement("tr");
  const checkCell = document.createElement("td"); const check = document.createElement("input"); check.type = "checkbox"; check.setAttribute("aria-label", `Seleccionar ${user.nombres} ${user.apellidos}`); checkCell.append(check);
  const nameCell = document.createElement("td"); const link = document.createElement("a"); link.className = "user-cell user-detail-link"; link.href = `/usuarios/detalle?id=${encodeURIComponent(user.idUsuario)}`;
  const avatar = document.createElement("span"); avatar.className = `user-avatar ${["avatar-purple", "avatar-coral", "avatar-photo", "avatar-peach", "avatar-green"][index % 5]}`; avatar.textContent = `${user.nombres?.[0] || ""}${user.apellidos?.[0] || ""}`.toUpperCase();
  const details = document.createElement("span"); const name = document.createElement("b"); name.textContent = `${user.nombres} ${user.apellidos}`; const email = document.createElement("small"); email.textContent = user.email || ""; details.append(name, email); link.append(avatar, details); nameCell.append(link);
  const idCell = document.createElement("td"); const id = document.createElement("span"); id.className = "employee-id"; id.textContent = `#${user.idUsuario}`; idCell.append(id);
  const role = document.createElement("td"); role.textContent = user.rol || "Sin rol";
  const stateCell = document.createElement("td"); const state = document.createElement("span"); state.className = `user-state ${user.activo ? "state-on" : "state-off"}`; state.textContent = user.activo ? "● Activo" : "● Inactivo"; stateCell.append(state);
  const actions = document.createElement("td"); const remove = document.createElement("button"); remove.className = "row-menu"; remove.type = "button"; remove.textContent = "⋮"; remove.setAttribute("aria-label", `Eliminar ${user.nombres} ${user.apellidos}`); remove.addEventListener("click", async () => { if (!confirm(`¿Eliminar a ${user.nombres} ${user.apellidos}?`)) return; const response = await fetch(`${usersApi}/${user.idUsuario}`, { method: "DELETE" }); if (response.ok) loadUsers(); else showError(`No se pudo eliminar. Error HTTP ${response.status}`); }); actions.append(remove);
  row.append(checkCell, nameCell, idCell, role, stateCell, actions); body.append(row);
 });
 if (!matches.length) { const row = document.createElement("tr"); const cell = document.createElement("td"); cell.colSpan = 6; cell.className = "text-center py-4 text-secondary"; cell.textContent = "No hay usuarios que coincidan con la búsqueda."; row.append(cell); body.append(row); }
}
function showError(text) { notice.hidden = false; notice.className = "alert alert-danger"; notice.textContent = text; }
async function loadUsers() { notice.hidden = false; notice.textContent = "Cargando usuarios..."; try { const response = await fetch(usersApi, { headers: { Accept: "application/json" } }); if (!response.ok) throw new Error(`Error HTTP ${response.status}`); allUsers = await response.json(); notice.hidden = true; renderUsers(); } catch (error) { showError(`No se pudieron cargar los usuarios. ${error.message}`); } }
document.querySelectorAll(".admin-search, .user-search").forEach(form => { const input = form.querySelector('input[type="search"]'); if (!input) return; form.addEventListener("submit", event => event.preventDefault()); input.addEventListener("input", () => renderUsers(input.value)); });
const allCheck = document.querySelector('.users-table thead input[type="checkbox"]'); if (allCheck) allCheck.addEventListener("change", event => body.querySelectorAll('input[type="checkbox"]').forEach(check => check.checked = event.target.checked));
loadUsers();
</script>
</body>

</html>
