<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Libros | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=notifications,account_circle,groups" />
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar"><a class="admin-brand" th:href="@{/dashboard}">Bibliot.</a>
            <nav class="admin-nav" aria-label="Navegación principal">
                <a th:href="@{/roles}"><span class="nav-icon">▱</span>Roles</a>
                <a th:href="@{/usuarios}"><span class="nav-icon"><span class="material-symbols-outlined">groups</span></span>Usuarios</a>
                <a class="active" th:href="@{/libros}" aria-current="page"><span class="nav-icon">▤</span>Libros</a>
                <a th:href="@{/dashboard}"><span class="nav-icon">◷</span>Reportes</a>
                <a th:href="@{/configuracion}"><span class="nav-icon">⚙</span>Ajustes</a>
            </nav>
                <a class="signout-link" th:href="@{/login}">↪ <span>Cerrar sesión</span></a>
        </aside>
        <main class="admin-main">
            <header class="admin-topbar">
                <form class="admin-search api-book-search" role="search" th:action="@{/libros}" method="get"><span
                        aria-hidden="true">⌕</span><input type="search" name="q" placeholder="Buscar"
                        aria-label="Buscar"></form>
                <div class="topbar-actions"><button class="round-action" type="button" aria-label="Notificaciones"><span
                            class="material-symbols-outlined">notifications</span></button><button
                        class="round-action user-action" type="button" aria-label="Perfil"><span
                            class="material-symbols-outlined">account_circle</span></button></div>
            </header>
            <section class="users-content">
                <div class="users-heading-row">
                    <h1 class="page-heading mb-1">Libros <span class="users-total">ⓘ <b id="book-count">0</b></span></h1>
                    <div class="users-actions"><button class="btn btn-outline-secondary btn-sm" type="button" disabled>⇩
                            Exportar</button><a class="btn btn-brand btn-sm" th:href="@{/libros/nuevo}">＋ Agregar
                            libro</a></div>
                </div>
                <div class="alert alert-info" id="books-message" role="status">Cargando libros…</div>
                <div class="user-tabs"><a class="selected" th:href="@{/libros}">Todos</a><span class="text-secondary px-3 py-2" aria-disabled="true">Categorías</span>
                </div>
                <div class="user-toolbar">
                    <form class="user-search api-book-search" th:action="@{/libros}" method="get"><span
                            aria-hidden="true">⌕</span><input type="search" name="libro" placeholder="Buscar libro"
                            aria-label="Buscar libro"></form>
                    <div class="table-tools"><button class="btn btn-outline-secondary btn-sm" type="button" disabled>☷
                            <span>Filtrar</span></button><button class="view-toggle active" type="button"
                            aria-label="Vista de lista" disabled>☷</button><button class="view-toggle" type="button" disabled
                            aria-label="Vista de tarjetas">▦</button></div>
                </div>
                <div class="table-responsive users-table-wrap">
                    <table class="table users-table books-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="check-col"><input type="checkbox" aria-label="Seleccionar todos"></th>
                                <th>Nombre</th>
                                <th>Libro ID</th>
                                <th>Formato ⓘ</th>
                                <th>Categoría ⓘ</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="books-table-body"></tbody>
                    </table>
                    <nav class="users-pagination" aria-label="Paginación"><button class="page-btn" type="button" disabled>←
                            <span>Anteriores</span></button>
                        <div class="page-numbers"><button class="current" type="button" disabled>1</button><button
                                type="button" disabled>2</button><button type="button" disabled>3</button><span>…</span><button
                                type="button" disabled>8</button><button type="button" disabled>9</button><button
                                type="button" disabled>10</button></div><button class="page-btn"
                            type="button" disabled><span>Siguiente</span> →</button>
                    </nav>
                </div>
            </section>
        </main>
    </div>
    <script th:inline="javascript">
        const apiLibrosUrl = /*[[@{/api/admin/libros}]]*/ '/api/admin/libros';
        const cuerpoLibros = document.getElementById('books-table-body');
        const mensajeLibros = document.getElementById('books-message');
        const totalLibros = document.getElementById('book-count');

        function crearCelda(texto, clase) {
            const celda = document.createElement('td');
            if (clase) celda.className = clase;
            celda.textContent = texto;
            return celda;
        }

        function dibujarLibros(libros) {
            cuerpoLibros.replaceChildren();
            totalLibros.textContent = libros.length;
            if (libros.length === 0) {
                const fila = document.createElement('tr');
                const celda = crearCelda('No se encontraron libros.', 'text-center py-4');
                celda.colSpan = 7;
                fila.append(celda);
                cuerpoLibros.append(fila);
                return;
            }

            libros.forEach(libro => {
                const fila = document.createElement('tr');
                const seleccion = document.createElement('td');
                const casilla = document.createElement('input');
                casilla.type = 'checkbox';
                casilla.setAttribute('aria-label', `Seleccionar ${libro.titulo}`);
                seleccion.append(casilla);
                fila.append(seleccion);

                const nombre = document.createElement('td');
                const contenedor = document.createElement('div');
                contenedor.className = 'book-title-cell';
                const titulo = document.createElement('b');
                titulo.textContent = libro.titulo || 'Sin título';
                const subtitulo = document.createElement('small');
                subtitulo.textContent = (libro.autores || []).join(', ') || (libro.isbn ? `ISBN ${libro.isbn}` : '');
                const enlace = document.createElement('a');
                enlace.className = 'link-dark text-decoration-none d-flex flex-column';
                enlace.href = `/libros/editar?id=${encodeURIComponent(libro.idLibro)}`;
                enlace.append(titulo, subtitulo);
                contenedor.append(enlace);
                nombre.append(contenedor);
                fila.append(nombre);

                fila.append(crearCelda(`#${libro.idLibro}`, 'employee-id'));
                fila.append(crearCelda(libro.formato || 'Sin ejemplares'));
                fila.append(crearCelda((libro.categorias || []).join(', ') || '—'));
                const estado = document.createElement('td');
                const etiqueta = document.createElement('span');
                const disponible = libro.estado === 'Disponible';
                etiqueta.className = `user-state ${disponible ? 'state-on' : 'state-off'}`;
                etiqueta.textContent = `● ${libro.estado || 'Sin estado'}`;
                estado.append(etiqueta);
                fila.append(estado);
                const acciones = document.createElement('td');
                const boton = document.createElement('button');
                boton.className = 'row-menu';
                boton.type = 'button';
                boton.setAttribute('aria-label', 'Opciones del libro');
                boton.textContent = '⋮';
                boton.addEventListener('click', () => {
                    if (window.confirm(`¿Eliminar “${libro.titulo}”?`)) eliminarLibro(libro.idLibro);
                });
                acciones.append(boton);
                fila.append(acciones);
                cuerpoLibros.append(fila);
            });
        }

        async function eliminarLibro(id) {
            try {
                const response = await fetch(`${apiLibrosUrl}/${encodeURIComponent(id)}`, { method: 'DELETE' });
                if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
                cargarLibros();
            } catch (error) {
                mensajeLibros.hidden = false;
                mensajeLibros.textContent = `No se pudo eliminar el libro: ${error.message}`;
            }
        }

        async function cargarLibros(q = '') {
            mensajeLibros.textContent = 'Cargando libros…';
            try {
                const url = new URL(apiLibrosUrl, window.location.origin);
                if (q.trim()) url.searchParams.set('q', q.trim());
                const respuesta = await fetch(url, { headers: { Accept: 'application/json' } });
                if (!respuesta.ok) throw new Error(`Error HTTP ${respuesta.status}`);
                const libros = await respuesta.json();
                dibujarLibros(libros);
                mensajeLibros.hidden = true;
            } catch (error) {
                mensajeLibros.hidden = false;
                mensajeLibros.textContent = 'No se pudo cargar el catálogo. Comprueba la conexión con el servidor.';
            }
        }

        document.querySelectorAll('.api-book-search').forEach(formulario => {
            formulario.addEventListener('submit', evento => {
                evento.preventDefault();
                cargarLibros(formulario.querySelector('input[type="search"]').value);
            });
        });
        const busquedaInicial = new URLSearchParams(window.location.search).get('q') || '';
        document.querySelectorAll('.api-book-search input[type="search"]').forEach(input => input.value = busquedaInicial);
        cargarLibros(busquedaInicial);
    </script>
</body>

</html>
