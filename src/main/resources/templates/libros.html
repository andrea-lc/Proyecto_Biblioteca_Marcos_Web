<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <script th:replace="~{auth :: auth}"></script>
    <title>Libros | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,add,admin_panel_settings,business,delete,download,edit_note,filter_list,groups,home,logout,menu_book,notifications,query_stats,search,settings,swap_horiz" />
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside th:replace="~{admin-sidebar :: sidebar('libros')}" class="admin-sidebar"></aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <form class="admin-search api-book-search" id="book-search-form" role="search" th:action="@{/libros}" method="get">
                    <label class="visually-hidden" for="book-search">Buscar libros</label>
                    <span class="material-symbols-outlined" aria-hidden="true">search</span>
                    <input id="book-search" type="search" name="q" placeholder="Buscar libros" autocomplete="off">
                </form>
                <div class="topbar-actions">
                    <button class="round-action" type="button" aria-label="Notificaciones">
                        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                    </button>
                    <a class="round-action user-action" th:href="@{/perfil}" aria-label="Mi cuenta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                    </a>
                </div>
            </header>
            <section class="users-content" aria-labelledby="books-title">
                <div class="users-heading-row ed-enter">
                    <div>
                        <h1 class="page-heading" id="books-title">Libros <span class="users-total ed-count-pill"><b id="book-count">0</b></span></h1>
                    </div>
                    <div class="users-actions">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/reportes/libros/pdf}">
                            <span class="material-symbols-outlined" aria-hidden="true">download</span>PDF
                        </a>
                        <a class="btn btn-outline-success btn-sm" th:href="@{/reportes/libros/excel}">
                            <span class="material-symbols-outlined" aria-hidden="true">download</span>Excel
                        </a>
                        <a class="btn btn-brand btn-sm" th:href="@{/libros/nuevo}">
                            <span class="material-symbols-outlined" aria-hidden="true">add</span>Agregar libro
                        </a>
                    </div>
                </div>
                <nav class="user-tabs ed-tabs" aria-label="Secciones de libros">
                    <a class="selected" th:href="@{/libros}" aria-current="page">Todos</a>
                    <span aria-disabled="true">Categorías</span>
                </nav>

                <div class="alert alert-info ed-notice py-2 small mb-3" id="books-message" role="status" aria-live="polite">Cargando libros…</div>

                <div class="user-toolbar ed-toolbar ed-enter" data-stagger="1">
                    <span class="ed-card-meta">Catálogo de libros</span>
                    <div class="table-tools">
                        <button class="btn btn-outline-secondary btn-sm" id="toggle-book-filters" type="button" aria-expanded="false" aria-controls="book-filter-panel">
                            <span class="material-symbols-outlined" aria-hidden="true">filter_list</span>
                            Filtrar
                        </button>
                    </div>
                </div>

                <search id="book-filter-panel" class="ed-card p-3 p-md-4 mb-3" hidden>
                    <form id="book-filter-form" th:action="@{/libros}" method="get" aria-labelledby="book-filter-heading">
                        <fieldset class="border-0 p-0 m-0">
                            <legend class="ed-card-title mb-3" id="book-filter-heading">Filtros del catálogo</legend>
                            <div class="row g-3">
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <label class="form-label" for="filter-author">Autor</label>
                                    <select class="form-select" id="filter-author" name="autorId"><option value="">Todos los autores</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <label class="form-label" for="filter-publisher">Editorial</label>
                                    <select class="form-select" id="filter-publisher" name="editorialId"><option value="">Todas las editoriales</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <label class="form-label" for="filter-category">Categoría</label>
                                    <select class="form-select" id="filter-category" name="categoriaId"><option value="">Todas las categorías</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <label class="form-label" for="filter-status">Estado</label>
                                    <select class="form-select" id="filter-status" name="estado"><option value="">Todos los estados</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <label class="form-label" for="filter-format">Formato</label>
                                    <select class="form-select" id="filter-format" name="formato">
                                        <option value="">Todos los formatos</option>
                                        <option value="FISICO">Físico</option>
                                        <option value="DIGITAL">Digital</option>
                                        <option value="AMBOS">Físico y digital</option>
                                        <option value="SIN_FORMATO">Sin formato</option>
                                    </select>
                                </div>
                            </div>
                        </fieldset>
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <button class="btn btn-outline-secondary btn-sm" id="clear-book-filters" type="button">Limpiar filtros</button>
                            <button class="btn btn-brand btn-sm" type="submit">Aplicar filtros</button>
                        </div>
                    </form>
                    <p id="book-filter-message" class="small text-danger mt-3 mb-0" role="status" aria-live="polite" hidden></p>
                </search>

                <div class="table-responsive users-table-wrap ed-table-wrap ed-enter" data-stagger="2" tabindex="0" role="region" aria-labelledby="books-title">
                    <table class="table users-table ed-table books-table table-hover align-middle mb-0">
                        <caption class="visually-hidden">Libros registrados en el catálogo</caption>
                        <thead>
                            <tr>
                                <th class="check-col" scope="col"><input type="checkbox" aria-label="Seleccionar todos los libros"></th>
                                <th scope="col">Título y autoría</th>
                                <th scope="col">ID del libro</th>
                                <th scope="col">Formato</th>
                                <th scope="col">Categorías</th>
                                <th scope="col">Estado</th>
                                <th class="text-end" scope="col"><span class="visually-hidden">Acciones</span></th>
                            </tr>
                        </thead>
                        <tbody id="books-table-body">
                            <tr><td colspan="7" class="py-3"><span class="ed-skeleton ed-skeleton--row" aria-hidden="true"></span></td></tr>
                            <tr><td colspan="7" class="py-3"><span class="ed-skeleton ed-skeleton--row-md" aria-hidden="true"></span></td></tr>
                        </tbody>
                    </table>
                    <div class="ed-table-footer">
                        <span id="books-summary" role="status" aria-live="polite">Cargando libros…</span>
                        <nav class="d-flex align-items-center gap-2 flex-wrap" aria-label="Paginación de libros">
                            <label class="small" for="books-page-size">Por página</label>
                            <select id="books-page-size" class="form-select form-select-sm w-auto" aria-label="Libros por página">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                            </select>
                            <button id="books-previous" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Página anterior" disabled>Anterior</button>
                            <span id="books-page-status" class="small" aria-live="polite">Página 1 de 1</span>
                            <button id="books-next" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Página siguiente" disabled>Siguiente</button>
                        </nav>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script th:inline="javascript">
        const adminLibrosUrl = /*[[@{/api/admin/libros/pagina}]]*/ "/api/admin/libros/pagina";
        const biblioLibrosUrl = /*[[@{/api/bibliotecario/libros/pagina}]]*/ "/api/bibliotecario/libros/pagina";
        const adminLibrosCrudUrl = /*[[@{/api/admin/libros}]]*/ "/api/admin/libros";
        const biblioLibrosCrudUrl = /*[[@{/api/bibliotecario/libros}]]*/ "/api/bibliotecario/libros";
        const apiFiltrosUrl = /*[[@{/api/catalogo/filtros}]]*/ "/api/catalogo/filtros";
        const apiLibrosUrl = Auth.hasRole(['ADMINISTRADOR']) ? adminLibrosUrl : biblioLibrosUrl;
        const apiLibrosCrudUrl = Auth.hasRole(['ADMINISTRADOR']) ? adminLibrosCrudUrl : biblioLibrosCrudUrl;
        const cuerpoLibros = document.getElementById("books-table-body");
        const mensajeLibros = document.getElementById("books-message");
        const totalLibros = document.getElementById("book-count");
        const resumenLibros = document.getElementById("books-summary");
        const formularioBusqueda = document.getElementById("book-search-form");
        const campoBusqueda = document.getElementById("book-search");
        const seleccionarTodos = document.querySelector(".books-table thead input[type='checkbox']");
        const selectorTamano = document.getElementById("books-page-size");
        const botonAnterior = document.getElementById("books-previous");
        const botonSiguiente = document.getElementById("books-next");
        const estadoPagina = document.getElementById("books-page-status");
        const panelFiltros = document.getElementById("book-filter-panel");
        const alternarFiltros = document.getElementById("toggle-book-filters");
        const formularioFiltros = document.getElementById("book-filter-form");
        const mensajeFiltros = document.getElementById("book-filter-message");
        const selectorAutor = document.getElementById("filter-author");
        const selectorEditorial = document.getElementById("filter-publisher");
        const selectorCategoria = document.getElementById("filter-category");
        const selectorEstado = document.getElementById("filter-status");
        const selectorFormato = document.getElementById("filter-format");
        const parametrosIniciales = new URLSearchParams(window.location.search);
        let busquedaActual = "";
        let paginaActual = 0;
        const tamanosDisponibles = [10, 20, 50];
        const tamanoInicial = Number(parametrosIniciales.get("size"));
        let tamanoPagina = tamanosDisponibles.includes(tamanoInicial) ? tamanoInicial : Number(selectorTamano.value);
        let totalPaginas = 0;
        if (tamanosDisponibles.includes(tamanoPagina)) selectorTamano.value = String(tamanoPagina);
        let filtrosActuales = {
            autorId: parametrosIniciales.get("autorId") || "",
            editorialId: parametrosIniciales.get("editorialId") || "",
            categoriaId: parametrosIniciales.get("categoriaId") || "",
            estado: parametrosIniciales.get("estado") || "",
            formato: parametrosIniciales.get("formato") || ""
        };

        function crearCelda(texto, clase = "") {
            const celda = document.createElement("td");
            if (clase) celda.className = clase;
            celda.textContent = texto;
            return celda;
        }

        function mensaje(texto, tipo = "info") {
            mensajeLibros.hidden = false;
            mensajeLibros.className = `alert alert-${tipo} py-2 small mb-3`;
            mensajeLibros.textContent = texto;
        }

        function mostrarEstadoTabla(texto, cargando = false) {
            cuerpoLibros.replaceChildren();
            const fila = document.createElement("tr");
            const celda = crearCelda("", "text-center text-secondary py-5");
            celda.colSpan = 7;
            if (cargando) {
                const spinner = document.createElement("span");
                spinner.className = "spinner-border spinner-border-sm me-2";
                spinner.setAttribute("aria-hidden", "true");
                celda.append(spinner);
            }
            celda.append(document.createTextNode(texto));
            fila.append(celda);
            cuerpoLibros.append(fila);
        }

        function dibujarLibros(libros, termino = "", pagina = {}) {
            cuerpoLibros.replaceChildren();
            totalLibros.textContent = pagina.totalElements ?? libros.length;
            totalPaginas = pagina.totalPages ?? 0;
            paginaActual = pagina.page ?? 0;
            estadoPagina.textContent = `Página ${totalPaginas === 0 ? 0 : paginaActual + 1} de ${totalPaginas}`;
            botonAnterior.disabled = paginaActual <= 0;
            botonSiguiente.disabled = totalPaginas === 0 || paginaActual >= totalPaginas - 1;
            if (pagina.totalElements === 0) {
                resumenLibros.textContent = termino
                    ? "No hay libros que coincidan con la búsqueda."
                    : "Aún no hay libros registrados en el catálogo.";
            } else {
                const desde = paginaActual * tamanoPagina + 1;
                const hasta = Math.min(desde + libros.length - 1, pagina.totalElements);
                resumenLibros.textContent = `Mostrando ${desde}–${hasta} de ${pagina.totalElements} libros.`;
            }

            if (seleccionarTodos) seleccionarTodos.checked = false;
            if (libros.length === 0) {
                mostrarEstadoTabla(termino
                    ? "No hay libros que coincidan con la búsqueda."
                    : "Aún no hay libros registrados en el catálogo.");
                return;
            }

            libros.forEach(libro => {
                const fila = document.createElement("tr");
                const celdaSeleccion = document.createElement("td");
                const casilla = document.createElement("input");
                casilla.type = "checkbox";
                casilla.setAttribute("aria-label", `Seleccionar ${libro.titulo || "libro sin título"}`);
                celdaSeleccion.append(casilla);
                fila.append(celdaSeleccion);

                const celdaTitulo = document.createElement("td");
                const enlaceTitulo = document.createElement("a");
                enlaceTitulo.className = "book-title-cell link-dark text-decoration-none d-flex flex-column";
                enlaceTitulo.href = `/libros/editar?id=${encodeURIComponent(libro.idLibro)}`;
                const titulo = document.createElement("b");
                titulo.textContent = libro.titulo || "Sin título";
                const detalle = document.createElement("small");
                detalle.textContent = (libro.autores || []).join(", ") || (libro.isbn ? `ISBN ${libro.isbn}` : "Autoría no disponible");
                enlaceTitulo.append(titulo, detalle);
                celdaTitulo.append(enlaceTitulo);
                fila.append(celdaTitulo);

                fila.append(crearCelda(`#${libro.idLibro}`, "employee-id"));
                fila.append(crearCelda(libro.formato || "Sin ejemplares"));
                fila.append(crearCelda((libro.categorias || []).join(", ") || "Sin categoría"));

                const celdaEstado = document.createElement("td");
                const estado = document.createElement("span");
                const disponible = libro.estado === "Disponible";
                estado.className = `badge rounded-pill ${disponible ? "text-bg-success" : "text-bg-secondary"}`;
                estado.textContent = libro.estado || "Sin estado";
                celdaEstado.append(estado);
                fila.append(celdaEstado);

                const celdaAcciones = document.createElement("td");
                celdaAcciones.className = "text-end";
                if (Auth.hasRole(['ADMINISTRADOR'])) {
                    const contenedorAcciones = document.createElement("div");
                    contenedorAcciones.className = "ed-row-actions";
                    const eliminar = document.createElement("button");
                    eliminar.className = "btn btn-sm btn-outline-danger ed-btn-icon";
                    eliminar.type = "button";
                    eliminar.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">delete</span><span class="visually-hidden">Eliminar</span>';
                    eliminar.setAttribute("aria-label", `Eliminar ${libro.titulo || "libro sin título"}`);
                    eliminar.addEventListener("click", () => eliminarLibro(libro, eliminar));
                    contenedorAcciones.append(eliminar);
                    celdaAcciones.append(contenedorAcciones);
                }
                fila.append(celdaAcciones);

                cuerpoLibros.append(fila);
            });
        }

        async function mensajeErrorApi(respuesta) {
            const texto = await respuesta.text();
            if (!texto) return `Error HTTP ${respuesta.status}.`;
            try {
                const detalle = JSON.parse(texto);
                return detalle.message || detalle.detail || detalle.error || texto;
            } catch (_) {
                return texto.trim().startsWith("<")
                    ? `Error HTTP ${respuesta.status}. Comprueba el estado del servicio e inténtalo de nuevo.`
                    : texto;
            }
        }

        function llenarSelector(selector, elementos, etiquetaTodos, seleccionado = "") {
            selector.replaceChildren(new Option(etiquetaTodos, ""));
            elementos.forEach(elemento => {
                const opcion = new Option(elemento.nombre, String(elemento.id));
                selector.add(opcion);
            });
            selector.value = seleccionado;
        }

        function sincronizarUrl() {
            const url = new URL(window.location.href);
            const parametros = { q: busquedaActual, page: paginaActual, size: tamanoPagina, ...filtrosActuales };
            Object.entries(parametros).forEach(([nombre, valor]) => {
                if (valor !== "" && valor !== null && valor !== undefined) url.searchParams.set(nombre, String(valor));
                else url.searchParams.delete(nombre);
            });
            window.history.replaceState(null, "", url);
        }

        async function cargarOpcionesFiltros() {
            try {
                const respuesta = await fetch(apiFiltrosUrl, { headers: { Accept: "application/json" } });
                if (!respuesta.ok) throw new Error(await mensajeErrorApi(respuesta));
                const opciones = await respuesta.json();
                llenarSelector(selectorAutor, opciones.autores || [], "Todos los autores", filtrosActuales.autorId);
                llenarSelector(selectorEditorial, opciones.editoriales || [], "Todas las editoriales", filtrosActuales.editorialId);
                llenarSelector(selectorCategoria, opciones.categorias || [], "Todas las categorías", filtrosActuales.categoriaId);
                llenarSelector(selectorEstado, (opciones.estados || []).map(estado => ({ id: estado, nombre: estado })), "Todos los estados", filtrosActuales.estado);
                selectorFormato.value = filtrosActuales.formato;
            } catch (error) {
                mensajeFiltros.textContent = `No se pudieron cargar las opciones de filtros. ${error.message}`;
                mensajeFiltros.hidden = false;
            }
        }

        async function cargarLibros(q = "", paginaSolicitada = 0, filtros = filtrosActuales) {
            busquedaActual = q.trim();
            filtrosActuales = { ...filtros };
            paginaActual = Math.max(0, paginaSolicitada);
            sincronizarUrl();
            mensaje("Cargando libros…");
            resumenLibros.textContent = "Cargando libros…";
            mostrarEstadoTabla("Cargando el catálogo…", true);
            if (seleccionarTodos) seleccionarTodos.checked = false;

            try {
                const url = new URL(apiLibrosUrl, window.location.origin);
                if (busquedaActual) url.searchParams.set("q", busquedaActual);
                url.searchParams.set("page", String(paginaActual));
                url.searchParams.set("size", String(tamanoPagina));
                Object.entries(filtrosActuales).forEach(([nombre, valor]) => {
                    if (valor) url.searchParams.set(nombre, valor);
                });
                const respuesta = await fetch(url, { headers: { Accept: "application/json" } });
                if (!respuesta.ok) throw new Error(await mensajeErrorApi(respuesta));
                const resultado = await respuesta.json();
                if (!Array.isArray(resultado.content)) throw new Error("La respuesta de paginación no tiene el formato esperado.");
                if (resultado.content.length === 0 && resultado.totalElements > 0 && resultado.totalPages > 0 && paginaActual >= resultado.totalPages) {
                    return cargarLibros(busquedaActual, resultado.totalPages - 1, filtrosActuales);
                }
                dibujarLibros(resultado.content, busquedaActual, resultado);
                mensajeLibros.hidden = true;
                return true;
            } catch (error) {
                mensaje(`No se pudo cargar el catálogo. ${error.message}`, "danger");
                resumenLibros.textContent = "No se pudo cargar el catálogo.";
                mostrarEstadoTabla("Comprueba la conexión con el servidor e inténtalo de nuevo.");
                return false;
            }
        }

        async function eliminarLibro(libro, boton) {
            if (!window.confirm(`¿Eliminar “${libro.titulo}” junto con sus ejemplares, préstamos, devoluciones, sanciones, reservas y archivos asociados?`)) return;
            boton.disabled = true;
            boton.setAttribute("aria-busy", "true");
            boton.innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span class="visually-hidden">Eliminando</span>';

            try {
                const respuesta = await fetch(`${apiLibrosCrudUrl}/${encodeURIComponent(libro.idLibro)}`, { method: "DELETE" });
                if (!respuesta.ok) throw new Error(await mensajeErrorApi(respuesta));
                if (await cargarLibros(busquedaActual, paginaActual, filtrosActuales)) mensaje(`Se eliminó “${libro.titulo}”.`, "success");
            } catch (error) {
                mensaje(`No se pudo eliminar “${libro.titulo}”. ${error.message}`, "danger");
                if (boton.isConnected) {
                    boton.disabled = false;
                    boton.removeAttribute("aria-busy");
                    boton.innerHTML = '<span class="material-symbols-outlined align-middle" aria-hidden="true">delete</span><span class="visually-hidden">Eliminar</span>';
                }
            }
        }

        formularioBusqueda.addEventListener("submit", evento => {
            evento.preventDefault();
            cargarLibros(campoBusqueda.value, 0, filtrosActuales);
        });
        campoBusqueda.value = parametrosIniciales.get("q") || "";
        const hayFiltrosIniciales = Object.values(filtrosActuales).some(Boolean);
        if (hayFiltrosIniciales) {
            panelFiltros.hidden = false;
            alternarFiltros.setAttribute("aria-expanded", "true");
        }
        alternarFiltros.addEventListener("click", () => {
            const abierto = alternarFiltros.getAttribute("aria-expanded") === "true";
            alternarFiltros.setAttribute("aria-expanded", String(!abierto));
            panelFiltros.hidden = abierto;
        });
        formularioFiltros.addEventListener("submit", evento => {
            evento.preventDefault();
            filtrosActuales = Object.fromEntries(new FormData(formularioFiltros).entries());
            cargarLibros(campoBusqueda.value, 0, filtrosActuales);
        });
        document.getElementById("clear-book-filters").addEventListener("click", () => {
            formularioFiltros.reset();
            filtrosActuales = { autorId: "", editorialId: "", categoriaId: "", estado: "", formato: "" };
            mensajeFiltros.hidden = true;
            cargarLibros(campoBusqueda.value, 0, filtrosActuales);
        });
        if (seleccionarTodos) seleccionarTodos.addEventListener("change", evento => {
            cuerpoLibros.querySelectorAll('input[type="checkbox"]').forEach(casilla => casilla.checked = evento.target.checked);
        });

        botonAnterior.addEventListener("click", () => cargarLibros(busquedaActual, paginaActual - 1, filtrosActuales));
        botonSiguiente.addEventListener("click", () => cargarLibros(busquedaActual, paginaActual + 1, filtrosActuales));
        selectorTamano.addEventListener("change", () => {
            tamanoPagina = Number(selectorTamano.value);
            cargarLibros(busquedaActual, 0, filtrosActuales);
        });

        cargarOpcionesFiltros();
        cargarLibros(campoBusqueda.value, Number(parametrosIniciales.get("page")) || 0, filtrosActuales);
    </script>
</body>

</html>
