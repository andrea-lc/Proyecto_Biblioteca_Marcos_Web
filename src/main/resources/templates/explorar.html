<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliot - Explorar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdfaf5; }
        .bg-sidebar { background-color: #ede5d8; min-height: 100vh; }
        .text-brand { color: #5a5040; }
        .btn-brand { background-color: #9d927d; color: white; border: none; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block bg-sidebar sidebar p-4">
            <div class="position-sticky">
                <h2 class="mb-4 text-brand fw-bold">Bibliot.</h2>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a class="nav-link text-dark" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white bg-secondary bg-opacity-50 rounded fw-bold" href="#">Explorar</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-5">
            <!-- Buscador principal -->
            <div class="input-group input-group-lg mb-4 shadow-sm rounded">
                <input type="text" class="form-control border-0" placeholder="Buscar libro...">
                <button class="btn btn-brand px-4 fw-bold" type="button">Búsqueda avanzada</button>
            </div>

            <!-- Filtros -->
            <div class="row g-3 mb-5">
                <div class="col-md-3"><select class="form-select border-0 shadow-sm"><option>Autor</option></select></div>
                <div class="col-md-3"><select class="form-select border-0 shadow-sm"><option>Categoría</option></select></div>
                <div class="col-md-3"><select class="form-select border-0 shadow-sm"><option>Cantidad de páginas</option></select></div>
                <div class="col-md-3"><select class="form-select border-0 shadow-sm"><option>Editorial</option></select></div>
                <div class="col-12"><select class="form-select border-0 shadow-sm"><option>Año de publicación</option></select></div>
            </div>

            <!-- Resultados -->
            <div class="row row-cols-2 row-cols-md-5 g-4">
                <div class="col"><div class="card h-100 border-0 shadow-sm"><img src="https://via.placeholder.com/300x450" class="card-img-top"></div></div>
                <div class="col"><div class="card h-100 border-0 shadow-sm"><img src="https://via.placeholder.com/300x450" class="card-img-top"></div></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
