<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Explorar | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=notifications,account_circle" />
</head>
<body class="catalog-body">
<aside class="catalog-sidebar">
    <a class="catalog-brand" th:href="@{/index}">Bibliot.</a>
    <nav class="catalog-nav" aria-label="Navegación principal">
        <a th:href="@{/index}"><span aria-hidden="true">⌂</span>Inicio</a>
        <a class="active" th:href="@{/explorar}" aria-current="page"><span aria-hidden="true">⊘</span>Explorar</a>
    </nav>
    <nav class="catalog-nav catalog-bottom-nav" aria-label="Ayuda y configuración">
        <a th:href="@{/perfil}"><span aria-hidden="true">♙</span>Mi cuenta</a>
        <a th:href="@{/ayuda}"><span aria-hidden="true">ⓘ</span>Ayuda</a>
    </nav>
</aside>
<main class="catalog-main">
    <header class="catalog-topbar">
        <button class="catalog-menu" type="button" aria-label="Abrir menú">☰</button>
        <div class="catalog-account-actions"><a th:href="@{/notificaciones}" class="catalog-icon-button" aria-label="Notificaciones"><span class="material-symbols-outlined">notifications</span></a><a th:href="@{/perfil}" class="catalog-icon-button" aria-label="Mi perfil"><span class="material-symbols-outlined">account_circle</span></a></div>
    </header>
    <section class="explore-content">
        <nav class="genre-cards" aria-label="Géneros destacados">
            <a class="genre-card genre-kids" th:href="@{/explorar(categoria='infantil')}"><span>Infantil</span></a>
            <a class="genre-card genre-romance" th:href="@{/explorar(categoria='romance')}"><span>Romance</span></a>
            <a class="genre-card genre-politics" th:href="@{/explorar(categoria='politica')}"><span>Política</span></a>
        </nav>
        <form class="explore-search-row" id="catalog-search-form" th:action="@{/explorar}" method="get" role="search">
            <label class="explore-search"><input type="search" name="q" placeholder="Buscar libro" aria-label="Buscar libro"><button type="submit" aria-label="Buscar">⌕</button></label>
            <button class="advanced-search" type="button" disabled aria-label="Búsqueda avanzada no disponible">Búsqueda avanzada</button>
        </form>
        <form class="explore-filters" th:action="@{/explorar}" method="get" aria-label="Filtros de libros">
            <select class="form-select" name="autorId" aria-label="Filtrar por autor"><option value="">Autor</option></select>
            <select class="form-select" name="categoriaId" aria-label="Filtrar por categoría"><option value="">Categoría</option></select>
            <select class="form-select" name="paginas" aria-label="Filtrar por cantidad de páginas"><option value="">Cantidad de páginas</option><option value="menos200">Menos de 200</option><option value="200a400">200 a 400</option><option value="mas400">Más de 400</option></select>
            <select class="form-select" name="editorialId" aria-label="Filtrar por editorial"><option value="">Editorial</option></select>
            <select class="form-select year-filter" name="anio" aria-label="Filtrar por año de publicación"><option value="">Año de publicación</option><option value="2020-2026">2020–2026</option><option value="2000-2019">2000–2019</option><option value="-1999">Antes de 2000</option></select>
        </form>
        <div class="explore-view-tools" aria-label="Opciones de vista"><button type="button" class="selected" aria-label="Vista de lista" disabled>▤</button><span></span><button type="button" aria-label="Vista de cuadrícula" disabled>▦</button></div>
        <div class="alert alert-info" id="catalog-message" role="status">Cargando catálogo…</div>
        <section class="explore-results" id="catalog-results" aria-label="Libros">
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780140449136-L.jpg" alt="Portada de La Odisea" loading="lazy"><span>La Odisea</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780140449266-L.jpg" alt="Portada de La Ilíada" loading="lazy"><span>La Ilíada</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780062315007-L.jpg" alt="Portada de El alquimista" loading="lazy"><span>El alquimista</span></a>
            <a class="explore-book" th:href="@{/detalle_virtual}"><img src="https://covers.openlibrary.org/b/isbn/9780140449273-L.jpg" alt="Portada de La Eneida" loading="lazy"><span>La Eneida</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780553380163-L.jpg" alt="Portada de Breve historia del tiempo" loading="lazy"><span>Breve historia del tiempo</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780140449266-L.jpg" alt="Portada de La Ilíada" loading="lazy"><span>El viento entre los sauces</span></a>
            <a class="explore-book" th:href="@{/detalle_virtual}"><img src="https://covers.openlibrary.org/b/isbn/9780140449136-L.jpg" alt="Portada de La Odisea" loading="lazy"><span>Antología de cuentos</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780140449273-L.jpg" alt="Portada de La Eneida" loading="lazy"><span>La invención de Morel</span></a>
            <a class="explore-book" th:href="@{/detalle_virtual}"><img src="https://covers.openlibrary.org/b/isbn/9780062315007-L.jpg" alt="Portada de El alquimista" loading="lazy"><span>El viaje del héroe</span></a>
            <a class="explore-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780553380163-L.jpg" alt="Portada de Breve historia del tiempo" loading="lazy"><span>Ciencia para todos</span></a>
        </section>
    </section>
</main>
<script th:inline="javascript">
    const catalogApi = /*[[@{/api/catalogo/libros}]]*/ '/api/catalogo/libros';
    const authorsApi = /*[[@{/api/admin/autores}]]*/ '/api/admin/autores';
    const categoriesApi = /*[[@{/api/admin/categorias}]]*/ '/api/admin/categorias';
    const publishersApi = /*[[@{/api/admin/editoriales}]]*/ '/api/admin/editoriales';
    const results = document.getElementById('catalog-results');
    const message = document.getElementById('catalog-message');
    const filters = document.querySelector('.explore-filters');
    const searchForm = document.getElementById('catalog-search-form');
    const params = new URLSearchParams(window.location.search);
    results.replaceChildren();
    const addOptions = (select, items, idKey, labelFn) => items.forEach(item => select.add(new Option(labelFn(item), item[idKey])));
    async function loadOptions() {
        const [authors, categories, publishers] = await Promise.all([authorsApi, categoriesApi, publishersApi].map(async url => {
            const response = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
            return response.json();
        }));
        addOptions(filters.elements.autorId, authors, 'idAutor', item => `${item.nombres || ''} ${item.apellidos || ''}`.trim());
        addOptions(filters.elements.categoriaId, categories, 'idCategoria', item => item.nombre);
        addOptions(filters.elements.editorialId, publishers, 'idEditorial', item => item.nombre);
    }
    function selectFromQuery(select, key) {
        if (params.has(key)) select.value = params.get(key);
    }
    function drawBooks(books) {
        results.replaceChildren();
        books.forEach(book => {
            const link = document.createElement('a');
            link.className = 'explore-book';
            link.href = `/${book.formato === 'Digital' ? 'detalle-virtual' : 'detalle-fisico'}?id=${encodeURIComponent(book.idLibro)}`;
            const cover = document.createElement('img');
            cover.src = book.isbn ? `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(book.isbn)}-L.jpg` : '';
            cover.alt = `Portada de ${book.titulo || 'libro'}`;
            cover.loading = 'lazy';
            const title = document.createElement('span');
            title.textContent = book.titulo || 'Sin título';
            link.append(cover, title);
            results.append(link);
        });
        if (!books.length) { message.textContent = 'No se encontraron libros con esos filtros.'; message.hidden = false; }
        else message.hidden = true;
    }
    async function searchBooks() {
        const query = new URLSearchParams();
        const q = searchForm.elements.q.value.trim();
        if (q) query.set('q', q);
        ['autorId', 'categoriaId', 'paginas', 'editorialId'].forEach(key => { if (filters.elements[key].value) query.set(key, filters.elements[key].value); });
        if (!filters.elements.categoriaId.value && params.get('categoria')) query.set('categoria', params.get('categoria'));
        const year = filters.elements.anio.value;
        if (year) {
            if (year.startsWith('-')) query.set('anioHasta', year.slice(1));
            else { const [from, to] = year.split('-'); query.set('anioDesde', from); query.set('anioHasta', to); }
        }
        message.hidden = false; message.textContent = 'Cargando catálogo…';
        try {
            const response = await fetch(`${catalogApi}?${query}`, { headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
            drawBooks(await response.json());
        } catch (error) { message.hidden = false; message.textContent = `No se pudo cargar el catálogo. ${error.message}`; }
    }
    searchForm.addEventListener('submit', event => { event.preventDefault(); searchBooks(); });
    filters.addEventListener('change', searchBooks);
    (async () => {
        try {
            await loadOptions();
            searchForm.elements.q.value = params.get('q') || '';
            ['autorId', 'categoriaId', 'paginas', 'editorialId'].forEach(key => selectFromQuery(filters.elements[key], key));
            if (params.has('anio')) {
                filters.elements.anio.value = params.get('anio');
            } else if (params.has('anioDesde') || params.has('anioHasta')) {
                const start = params.get('anioDesde'), end = params.get('anioHasta');
                filters.elements.anio.value = !start && end ? `-${end}` : `${start || ''}-${end || ''}`;
            }
            const categoryName = params.get('categoria');
            if (categoryName && !filters.elements.categoriaId.value) {
                const match = [...filters.elements.categoriaId.options].find(option => option.text.toLowerCase().includes(categoryName.toLowerCase()));
                if (match) filters.elements.categoriaId.value = match.value;
            }
            await searchBooks();
        } catch (error) { message.hidden = false; message.textContent = `No se pudieron cargar los filtros del catálogo. ${error.message}`; }
    })();
</script>
</body>
</html>
