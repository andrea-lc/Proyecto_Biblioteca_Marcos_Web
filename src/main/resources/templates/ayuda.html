<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Ayuda | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body><header class="navbar bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/index}">Bibliot.</a><nav class="nav"><a class="nav-link text-dark" th:href="@{/explorar}">Explorar</a><a class="nav-link text-dark" th:href="@{/perfil}">Mi cuenta</a></nav></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-9"><p class="text-secondary mb-1">Bibliot.</p><h1 class="h2 mb-4">Ayuda</h1><div class="accordion" id="helpTopics"><section class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#browseHelp" aria-expanded="true" aria-controls="browseHelp">¿Cómo encuentro un libro?</button></h2><div id="browseHelp" class="accordion-collapse collapse show" data-bs-parent="#helpTopics"><div class="accordion-body">Abre Explorar para buscar por título y consultar las categorías disponibles.</div></div></section><section class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#accountHelp" aria-expanded="false" aria-controls="accountHelp">¿Dónde reviso mis préstamos?</button></h2><div id="accountHelp" class="accordion-collapse collapse" data-bs-parent="#helpTopics"><div class="accordion-body">Cuando la cuenta esté conectada, podrás verlos en <a th:href="@{/mis-prestamos}">Mis préstamos</a>.</div></div></section><section class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#contactHelp" aria-expanded="false" aria-controls="contactHelp">¿Necesitas más ayuda?</button></h2><div id="contactHelp" class="accordion-collapse collapse" data-bs-parent="#helpTopics"><div class="accordion-body">Los canales de atención deben ser proporcionados por la biblioteca.</div></div></section></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
