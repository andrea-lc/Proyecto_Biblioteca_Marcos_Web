<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <script th:replace="~{auth :: auth}"></script>
    <title th:text="${status != null ? 'Error ' + status + ' | Bibliot.' : 'Algo salió mal | Bibliot.'}">Error | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=error_outline,explore,home">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body class="ed-portal-page">
<header class="navbar ed-portal-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Bibliot.</a>
        <a class="nav-link" th:href="@{/explorar}">Explorar</a>
    </div>
</header>
<main class="ed-portal-main d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="ed-portal-empty-card ed-enter" aria-labelledby="error-page-title">
                    <div class="ed-portal-empty-icon" aria-hidden="true"><span class="material-symbols-outlined">error_outline</span></div>
                    <p class="ed-error-code" th:text="${status ?: 'Error'}">Error</p>
                    <h1 id="error-page-title"
                        th:text="${status == 404 ? 'No encontramos esa página' : (status == 403 ? 'No tienes acceso a esta página' : (status == 405 ? 'Acción no permitida en esta ruta' : 'Ocurrió un problema inesperado'))}">
                        Ocurrió un problema inesperado
                    </h1>
                    <p th:text="${status == 404 ? 'Puede que el enlace haya cambiado o que la página ya no exista.' : (status == 403 ? 'Inicia sesión con una cuenta autorizada para continuar.' : 'Intenta recargar la página o regresa al inicio de la biblioteca.')}">
                        Intenta recargar la página o regresa al inicio de la biblioteca.
                    </p>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <a class="btn btn-brand" th:href="@{/index}"><span class="material-symbols-outlined" aria-hidden="true">home</span>Ir al inicio</a>
                        <a class="btn btn-outline-secondary" th:href="@{/explorar}"><span class="material-symbols-outlined" aria-hidden="true">explore</span>Explorar catálogo</a>
                    </div>
                </section>
            </div>
        </div>
    </div>
</main>
</body>
</html>
