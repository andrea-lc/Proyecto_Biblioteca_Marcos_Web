<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/bibliot.css?v=7">
</head>
<body class="auth-page">
<main class="container-fluid p-0">
    <div class="row g-0 auth-shell">
        <section class="col-md-6 photo-panel auth-login-photo" aria-label="Biblioteca">
            <div class="photo-copy">
                <h1>Bienvenido de<br>nuevo</h1>
                <p>La aventura continúa en cada página.</p>
            </div>
        </section>
        <section class="col-md-6 form-panel">
            <div class="auth-card">
                <header class="text-center mb-4">
                    <div class="brand">Bibliot.</div>
                    <div class="tagline">Lee · Explora · Descubre</div>
                </header>
                <h2 class="h5 mb-1">Iniciar sesión</h2>
                <p class="text-secondary small mb-4">Ingresa con tu cuenta para acceder a tu perfil y seguir disfrutando de tus libros favoritos.</p>
                <div class="alert alert-info py-2 small" role="status" th:if="${formMessage}" th:text="${formMessage}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-transparent border-end-0" aria-hidden="true"><i class="bi bi-person"></i></span>
                        <input class="form-control border-start-0" type="text" name="username" autocomplete="username" placeholder="Correo electrónico o usuario" aria-label="Correo electrónico o usuario" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-transparent border-end-0" aria-hidden="true"><i class="bi bi-lock"></i></span>
                        <input class="form-control border-start-0" type="password" name="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
                    </div>
                    <div class="form-check small mb-3"><input class="form-check-input" type="checkbox" id="remember-me" name="remember-me"><label class="form-check-label" for="remember-me">Recordarme</label></div>
                    <button class="btn btn-brand w-100" type="submit">Iniciar sesión</button>
                </form>
                <div class="divider my-3">o</div>
                <a class="btn google-btn w-100 d-flex align-items-center justify-content-center gap-2" th:href="@{/oauth2/authorization/google}"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</a>
                <p class="text-center small mt-5 mb-0">¿No tienes una cuenta? <a th:href="@{/registro}" class="link-primary ms-1">Regístrate</a></p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
