<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bibliot. | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/bibliot.css?v=4">
</head>
<body class="catalog-body">
<aside class="catalog-sidebar">
    <a class="catalog-brand" th:href="@{/index}">Bibliot.</a>
    <nav class="catalog-nav" aria-label="Navegación principal">
        <a class="active" th:href="@{/index}"><span aria-hidden="true">⌂</span>Inicio</a>
        <a th:href="@{/explorar}"><span aria-hidden="true">⊘</span>Explorar</a>
    </nav>
    <nav class="catalog-nav catalog-bottom-nav" aria-label="Ayuda y configuración">
        <a href="#configuracion"><span aria-hidden="true">⚙</span>Configuración</a>
        <a href="#ayuda"><span aria-hidden="true">ⓘ</span>Ayuda</a>
    </nav>
</aside>

<main class="catalog-main">
    <header class="catalog-topbar">
        <button class="catalog-menu" type="button" aria-label="Abrir menú">☰</button>
        <div class="catalog-account-actions">
            <a th:href="@{/login}" class="catalog-icon-button" aria-label="Notificaciones">♧</a>
            <a th:href="@{/login}" class="catalog-icon-button" aria-label="Mi perfil">◎</a>
        </div>
    </header>

    <section class="catalog-content">
        <div class="catalog-hero" role="img" aria-label="Estanterías de libros en una biblioteca"></div>
        <form class="catalog-search" th:action="@{/explorar}" method="get" role="search">
            <input type="search" name="q" placeholder="Buscar libro" aria-label="Buscar libro">
            <button type="submit" aria-label="Buscar">⌕</button>
        </form>

        <nav class="category-strip" aria-label="Categorías">
            <a th:href="@{/explorar(categoria='infantil')}">Cuentos Infantiles</a>
            <a th:href="@{/explorar(categoria='aventuras')}">Aventuras Juveniles</a>
            <a th:href="@{/explorar(categoria='clasica')}">Literatura Clásica</a>
            <a th:href="@{/explorar(categoria='historia')}">Historia y Biografías</a>
            <a th:href="@{/explorar(categoria='arte')}">Arte y cultura</a>
            <a th:href="@{/explorar(categoria='ciencia')}">Ciencia</a>
        </nav>

        <section class="featured-section">
            <div class="featured-heading"><h1>Libros Destacados</h1><a th:href="@{/explorar}">Ver todos <span aria-hidden="true">→</span></a></div>
            <div class="featured-books">
                <a class="featured-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780553418026-L.jpg" alt="Portada del libro El marciano" loading="lazy"><span>El marciano</span></a>
                <a class="featured-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780399226908-L.jpg" alt="Portada de La pequeña oruga glotona" loading="lazy"><span>La pequeña oruga glotona</span></a>
                <a class="featured-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780553380163-L.jpg" alt="Portada de Breve historia del tiempo" loading="lazy"><span>Breve historia del tiempo</span></a>
                <a class="featured-book" th:href="@{/detalle_virtual}"><img src="https://covers.openlibrary.org/b/isbn/9780140442100-L.jpg" alt="Portada de La Odisea" loading="lazy"><span>La Odisea</span></a>
                <a class="featured-book" th:href="@{/detalle_fisico}"><img src="https://covers.openlibrary.org/b/isbn/9780140449266-L.jpg" alt="Portada de La Ilíada" loading="lazy"><span>La Ilíada</span></a>
            </div>
        </section>
    </section>
</main>
</body>
</html>
