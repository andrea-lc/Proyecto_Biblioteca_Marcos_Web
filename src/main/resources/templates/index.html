<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliot - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdfaf5; }
        .bg-sidebar { background-color: #ede5d8; min-height: 100vh; }
        .text-brand { color: #5a5040; }
        .btn-brand { background-color: #9d927d; color: white; border: none; }
        .btn-brand:hover { background-color: #837966; color: white; }
        .btn-category { background-color: #e6ddd0; color: #333; font-weight: 500; border: none; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-sidebar sidebar p-4">
            <div class="position-sticky">
                <h2 class="mb-4 text-brand fw-bold">Bibliot.</h2>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white bg-secondary bg-opacity-50 rounded fw-bold" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="explorar.html">Explorar</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-4">
            <!-- Buscador y Banner -->
            <div class="position-relative mb-5 text-center">
                <div class="bg-dark rounded-4" style="height: 250px; background: url('https://via.placeholder.com/1200x400') center/cover;"></div>
                <div class="position-absolute top-100 start-50 translate-middle w-50">
                    <input type="text" class="form-control form-control-lg shadow rounded-pill px-4" placeholder="Buscar libro...">
                </div>
            </div>

            <!-- Categorías -->
            <div class="d-flex gap-3 overflow-auto py-3 mt-4 mb-4">
                <button class="btn btn-category px-4 rounded-pill text-nowrap">Cuentos infantiles</button>
                <button class="btn btn-category px-4 rounded-pill text-nowrap">Aventuras Juveniles</button>
                <button class="btn btn-category px-4 rounded-pill text-nowrap">Literatura Clásica</button>
                <button class="btn btn-category px-4 rounded-pill text-nowrap">Historia y Biografías</button>
            </div>

            <!-- Libros Destacados -->
            <h4 class="fw-bold mb-4">Libros Destacados</h4>
            <div class="row row-cols-2 row-cols-md-4 g-4">
                <div class="col">
                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                        <img src="https://via.placeholder.com/300x450" class="card-img-top" alt="Libro 1">
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                        <img src="https://via.placeholder.com/300x450" class="card-img-top" alt="Libro 2">
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
