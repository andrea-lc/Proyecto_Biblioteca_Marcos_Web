<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Agregar libro | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body class="admin-body">
<main class="new-book-page">
    <header class="new-book-header"><a th:href="@{/libros}" class="back-link" aria-label="Volver a libros">‹</a><h1>Agregar un nuevo libro</h1><div class="new-book-actions"><a class="btn btn-brand" th:href="@{/libros}">Cancelar</a><button class="btn btn-sand" type="submit" form="book-form">Guardar libro</button></div></header>
    <div class="alert alert-info py-2 small mt-3" id="form-message" role="status" hidden></div>
    <form id="book-form" class="new-book-form">
        <section class="cover-column"><label class="form-section-title">Portada</label><div class="cover-upload"><span>Portada</span><small>La API actual todavía no guarda imágenes.</small></div></section>
        <section class="book-fields"><h2 class="form-section-title">Información del libro</h2>
            <div class="book-form-grid">
                <div class="book-field field-wide"><label for="title">Título <span>*</span></label><input id="title" name="titulo" class="form-control" type="text" maxlength="255" placeholder="Título del libro" required></div>
                <div class="book-field"><label for="isbn">ISBN</label><input id="isbn" name="isbn" class="form-control" type="text" placeholder="ISBN del libro"></div>
                <div class="book-field"><label for="pages">N.º de páginas</label><div class="input-with-action"><input id="pages" name="paginas" type="number" min="1" class="form-control" placeholder="Cantidad de páginas"><span class="field-plus">＋</span></div></div>
                <div class="book-field"><label for="publication">Fecha de publicación</label><input id="publication" name="fechaPublicacion" class="form-control" type="date"></div>
                <div class="book-field"><label for="status">Estado</label><select id="status" name="estado" class="form-select"><option value="">Seleccionar estado</option><option value="Disponible">Disponible</option><option value="No disponible">No disponible</option></select></div>
                <div class="book-field"><label for="publisher">Editorial</label><select id="publisher" name="idEditorial" class="form-select"><option value="">Seleccionar editorial</option></select></div>
                <div class="book-field"><label for="authors">Autores</label><select id="authors" name="autorIds" class="form-select" multiple aria-describedby="authors-help"></select><small id="authors-help" class="text-secondary">Puedes elegir más de uno.</small></div>
                <div class="book-field"><label for="categories">Categorías</label><select id="categories" name="categoriaIds" class="form-select" multiple aria-describedby="categories-help"></select><small id="categories-help" class="text-secondary">Puedes elegir más de una.</small></div>
                <div class="book-field"><label>Archivo PDF</label><div class="file-pick text-secondary">La API actual no guarda archivos</div></div>
                <div class="book-field field-wide"><label for="description">Descripción</label><textarea id="description" name="descripcion" class="form-control description-field" placeholder="Sinopsis del libro"></textarea></div>
                <div class="book-field field-wide"><label for="contentText">Contenido de lectura</label><textarea id="contentText" name="contenidoTexto" class="form-control description-field" rows="6" placeholder="Texto digital del libro (opcional)"></textarea></div>
            </div>
        </section>
    </form>
</main>
<script th:inline="javascript">
    const apiLibrosUrl = /*[[@{/api/admin/libros}]]*/ '/api/admin/libros';
    const listaLibrosUrl = /*[[@{/libros}]]*/ '/libros';
    const formularioLibro = document.getElementById('book-form');
    const mensajeFormulario = document.getElementById('form-message');

    async function cargarOpciones() {
        const [editorialesRespuesta, autoresRespuesta, categoriasRespuesta] = await Promise.all([
            fetch(/*[[@{/api/admin/editoriales}]]*/ '/api/admin/editoriales'),
            fetch(/*[[@{/api/admin/autores}]]*/ '/api/admin/autores'),
            fetch(/*[[@{/api/admin/categorias}]]*/ '/api/admin/categorias')
        ]);
        if (![editorialesRespuesta, autoresRespuesta, categoriasRespuesta].every(r => r.ok)) throw new Error('No se pudieron cargar editoriales, autores o categorías.');
        const [editoriales, autores, categorias] = await Promise.all([editorialesRespuesta.json(), autoresRespuesta.json(), categoriasRespuesta.json()]);
        editoriales.forEach(item => document.getElementById('publisher').add(new Option(item.nombre, item.idEditorial)));
        autores.forEach(item => document.getElementById('authors').add(new Option(`${item.nombres} ${item.apellidos}`, item.idAutor)));
        categorias.forEach(item => document.getElementById('categories').add(new Option(item.nombre, item.idCategoria)));
    }

    let errorOpciones = false;
    const opcionesListas = cargarOpciones().catch(error => {
        errorOpciones = true;
        mensajeFormulario.hidden = false;
        mensajeFormulario.className = 'alert alert-warning py-2 small mt-3';
        mensajeFormulario.textContent = error.message;
    });

    formularioLibro.addEventListener('submit', async evento => {
        evento.preventDefault();
        await opcionesListas;
        if (errorOpciones) return;
        const datos = new FormData(formularioLibro);
        const idEditorial = datos.get('idEditorial');
        const paginas = datos.get('paginas');
        const payload = {
            titulo: datos.get('titulo').trim(),
            isbn: datos.get('isbn').trim() || null,
            paginas: paginas ? Number(paginas) : null,
            fechaPublicacion: datos.get('fechaPublicacion') || null,
            estado: datos.get('estado') || null,
            descripcion: datos.get('descripcion').trim() || null,
            contenidoTexto: datos.get('contenidoTexto').trim() || null,
            idEditorial: idEditorial ? Number(idEditorial) : null,
            autorIds: [...document.getElementById('authors').selectedOptions].map(o => Number(o.value)),
            categoriaIds: [...document.getElementById('categories').selectedOptions].map(o => Number(o.value))
        };

        mensajeFormulario.hidden = false;
        mensajeFormulario.className = 'alert alert-info py-2 small mt-3';
        mensajeFormulario.textContent = 'Guardando libro…';
        try {
            const respuesta = await fetch(apiLibrosUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!respuesta.ok) throw new Error((await respuesta.text()) || `Error HTTP ${respuesta.status}`);
            window.location.assign(listaLibrosUrl);
        } catch (error) {
            mensajeFormulario.className = 'alert alert-danger py-2 small mt-3';
            mensajeFormulario.textContent = `No se pudo guardar el libro. ${error.message}`;
        }
    });
</script>
</body>
</html>
