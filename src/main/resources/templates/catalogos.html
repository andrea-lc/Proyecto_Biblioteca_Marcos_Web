<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base th:href="@{/}">
    <script th:replace="~{auth :: auth}"></script>
    <title th:text="${tipo == 'autor' ? 'Autores | Bibliot.' : 'Editoriales | Bibliot.'}">Catálogo | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,add,admin_panel_settings,business,delete,edit,edit_note,groups,home,logout,menu_book,notifications,query_stats,search,settings,swap_horiz,visibility">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/bibliot.css">
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside th:replace="~{admin-sidebar :: sidebar(${tipo == 'autor' ? 'autores' : 'editoriales'})}" class="admin-sidebar"></aside>
    <main class="admin-main">
        <header class="admin-topbar">
            <form class="admin-search" id="search-form" role="search">
                <label class="visually-hidden" for="search" th:text="${tipo == 'autor' ? 'Buscar autores' : 'Buscar editoriales'}">Buscar registros</label>
                <span class="material-symbols-outlined" aria-hidden="true">search</span>
                <input id="search" type="search" th:placeholder="${tipo == 'autor' ? 'Buscar autores' : 'Buscar editoriales'}" placeholder="Buscar" autocomplete="off">
            </form>
            <div class="topbar-actions">
                <button class="round-action" type="button" aria-label="Notificaciones"><span class="material-symbols-outlined" aria-hidden="true">notifications</span></button>
                <a class="round-action user-action" th:href="@{/perfil}" aria-label="Mi cuenta"><span class="material-symbols-outlined" aria-hidden="true">account_circle</span></a>
            </div>
        </header>
        <section class="users-content" aria-labelledby="catalog-title">
            <div class="users-heading-row ed-enter">
                <div>
                    <h1 class="page-heading" id="catalog-title"><span th:text="${tipo == 'autor' ? 'Autores' : 'Editoriales'}">Autores</span> <span class="users-total ed-count-pill"><b id="count">0</b></span></h1>
                    <p class="ed-page-subtitle" th:text="${tipo == 'autor' ? 'Administra la información de autoría y consulta sus libros.' : 'Administra las editoriales y consulta su catálogo asociado.'}">Administra el catálogo.</p>
                </div>
                <div class="users-actions">
                    <button data-roles="ADMINISTRADOR" class="btn btn-brand btn-sm" id="new-button" type="button" aria-expanded="false" aria-controls="record-form-panel"><span class="material-symbols-outlined" aria-hidden="true">add</span><span th:text="${tipo == 'autor' ? 'Agregar autor' : 'Agregar editorial'}">Agregar</span></button>
                </div>
            </div>

            <nav class="user-tabs ed-tabs" aria-label="Secciones de catálogo">
                <a th:href="@{/autores}" th:classappend="${tipo == 'autor'} ? 'selected' : ''" th:attr="aria-current=${tipo == 'autor' ? 'page' : null}">Autores</a>
                <a th:href="@{/editoriales}" th:classappend="${tipo != 'autor'} ? 'selected' : ''" th:attr="aria-current=${tipo != 'autor' ? 'page' : null}">Editoriales</a>
            </nav>

            <div class="alert alert-info ed-notice py-2 small mb-3" id="notice" role="status" aria-live="polite">Cargando registros…</div>

            <section data-roles="ADMINISTRADOR" class="ed-form-card mb-4 ed-enter" id="record-form-panel" hidden>
                <form id="record-form" novalidate>
                    <div class="ed-form-body">
                        <h2 class="ed-form-section-title" id="form-title">Nuevo registro</h2>
                        <p class="ed-form-section-desc" th:text="${tipo == 'autor' ? 'Completa los datos biográficos y de identificación del autor.' : 'Completa los datos de identificación y sitio web de la editorial.'}">Completa los datos del registro.</p>
                        <div class="row g-3" id="fields"></div>
                    </div>
                    <div class="ed-form-footer">
                        <button class="btn btn-outline-secondary" id="cancel-button" type="button">Cancelar</button>
                        <button class="btn btn-brand" id="save-button" type="submit">Guardar</button>
                    </div>
                </form>
            </section>

            <div class="user-toolbar ed-toolbar ed-enter" data-stagger="1">
                <span class="ed-card-meta" th:text="${tipo == 'autor' ? 'Directorio de autores' : 'Directorio de editoriales'}">Directorio</span>
            </div>

            <div class="table-responsive users-table-wrap ed-table-wrap ed-enter" data-stagger="2" tabindex="0" role="region" aria-labelledby="catalog-title">
                <table class="table users-table ed-table books-table table-hover align-middle mb-0">
                    <caption class="visually-hidden" th:text="${tipo == 'autor' ? 'Autores registrados' : 'Editoriales registradas'}">Registros</caption>
                    <thead>
                        <tr>
                            <th scope="col" th:text="${tipo == 'autor' ? 'Autor' : 'Editorial'}">Nombre</th>
                            <th scope="col">ID</th>
                            <th scope="col" th:text="${tipo == 'autor' ? 'Nacionalidad' : 'País'}">Dato</th>
                            <th scope="col">Libros asociados</th>
                            <th class="text-end" scope="col"><span class="visually-hidden">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr><td colspan="5" class="py-3"><span class="ed-skeleton ed-skeleton--row" aria-hidden="true"></span></td></tr>
                        <tr><td colspan="5" class="py-3"><span class="ed-skeleton ed-skeleton--row-md" aria-hidden="true"></span></td></tr>
                    </tbody>
                </table>
                <div class="ed-table-footer" id="summary" role="status" aria-live="polite">Cargando…</div>
            </div>
        </section>
    </main>
</div>
<script th:inline="javascript">
const tipo = /*[[${tipo}]]*/ 'autor';
const adminAutoresApi = /*[[@{/api/admin/autores}]]*/ '/api/admin/autores';
const adminEditorialesApi = /*[[@{/api/admin/editoriales}]]*/ '/api/admin/editoriales';
const biblioAutoresApi = /*[[@{/api/bibliotecario/autores}]]*/ '/api/bibliotecario/autores';
const biblioEditorialesApi = /*[[@{/api/bibliotecario/editoriales}]]*/ '/api/bibliotecario/editoriales';
const esAdministrador = Auth.hasRole(['ADMINISTRADOR']);
const adminApi = tipo === 'autor' ? adminAutoresApi : adminEditorialesApi;
const biblioApi = tipo === 'autor' ? biblioAutoresApi : biblioEditorialesApi;
const api = esAdministrador ? adminApi : biblioApi;
const listingApi = `${api}/con-libros`;
const rows = document.getElementById('rows'), notice = document.getElementById('notice'), panel = document.getElementById('record-form-panel');
const fields = document.getElementById('fields'), form = document.getElementById('record-form'), search = document.getElementById('search');
let data = [], editing = null;
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function showNotice(text, type='info') { notice.className = `alert alert-${type} py-2 small mb-3`; notice.textContent = text; notice.hidden = !text; }
function field(id,label,kind='text',required=false,max=null) { return `<div class="col-12 ${kind==='textarea'?'':'col-md-6'}"><label class="form-label" for="${id}">${label}${required?' <span aria-hidden="true">*</span>':''}</label>${kind==='textarea'?`<textarea class="form-control" id="${id}" name="${id}" rows="4" ${max?`maxlength="${max}"`:''} ${required?'required':''}></textarea>`:`<input class="form-control" id="${id}" name="${id}" type="${kind}" ${max?`maxlength="${max}"`:''} ${required?'required':''}>`}</div>`; }
function buildFields(){ fields.innerHTML = tipo==='autor' ? field('nombres','Nombres','text',true,100)+field('apellidos','Apellidos','text',true,100)+field('nacionalidad','Nacionalidad','text',false,100)+field('biografia','Biografía','textarea',false,5000) : field('nombre','Nombre de la editorial','text',true,150)+field('pais','País','text',false,100)+field('sitioWeb','Sitio web','url',false); }
function draw(){ const q=search.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); const visible=data.filter(x=>JSON.stringify(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)); document.getElementById('count').textContent=visible.length; document.getElementById('summary').textContent=`${visible.length} ${tipo==='autor'?(visible.length===1?'autor':'autores'):(visible.length===1?'editorial':'editoriales')} en el listado.`; rows.replaceChildren(); if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.className='text-center py-5 text-secondary';td.textContent=q?'No hay coincidencias con esa búsqueda.':'Aún no hay registros. Puedes agregar el primero.';tr.append(td);rows.append(tr);return;}
visible.forEach(x=>{const id=tipo==='autor'?x.idAutor:x.idEditorial;const name=tipo==='autor'?`${x.nombres} ${x.apellidos}`:x.nombre;const count=x.librosAsociados||0;const website=tipo==='editorial'&&/^https?:\/\//i.test(x.sitioWeb||'')?x.sitioWeb:null;const sub=tipo==='autor'?(x.biografia?x.biografia.slice(0,72)+(x.biografia.length>72?'…':''):'Autor registrado'):(website||'Editorial registrada');const detailHref=`/${tipo==='autor'?'autores':'editoriales'}/${id}`;const tr=document.createElement('tr');tr.innerHTML=`<td><a class="book-title-cell d-flex flex-column" href="${detailHref}"><b>${esc(name)}</b><small>${esc(sub)}</small></a></td><td class="employee-id">#${id}</td><td>${esc(tipo==='autor'?x.nacionalidad:x.pais)||'—'}</td><td><a class="text-decoration-none" href="${detailHref}"><span class="ed-badge ${count>0?'ed-badge--success':'ed-badge--neutral'}">${count} ${count===1?'libro':'libros'}</span></a></td><td class="text-end"><div class="ed-row-actions"><a class="btn btn-sm btn-outline-secondary ed-btn-icon" href="${detailHref}" aria-label="Ver detalle de ${esc(name)}" title="Ver detalle"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></a>${Auth.hasRole(['ADMINISTRADOR'])?`<button class="btn btn-sm btn-outline-secondary ed-btn-icon" type="button" data-edit="${id}" aria-label="Editar ${esc(name)}" title="Editar"><span class="material-symbols-outlined" aria-hidden="true">edit</span></button><button class="btn btn-sm btn-outline-danger ed-btn-icon" type="button" data-delete="${id}" aria-label="Eliminar ${esc(name)}" title="Eliminar"><span class="material-symbols-outlined" aria-hidden="true">delete</span></button>`:''}</div></td>`;rows.append(tr);}); }
async function apiError(res){const text=await res.text();try{const j=JSON.parse(text);return j.message||j.detail||j.error||text;}catch{return text||`Error HTTP ${res.status}`;}}
async function load(){showNotice('Cargando registros…');try{const r=await fetch(listingApi,{headers:{Accept:'application/json'}});if(!r.ok)throw Error(await apiError(r));data=await r.json();draw();showNotice('');}catch(e){showNotice(`No se pudo cargar el catálogo. ${e.message}`,'danger');rows.innerHTML='<tr><td colspan="5" class="text-center py-5">Comprueba la conexión con el servidor e inténtalo de nuevo.</td></tr>';}}
function openForm(item=null){editing=item;form.reset();form.querySelectorAll('.is-invalid').forEach(el=>el.classList.remove('is-invalid'));document.getElementById('form-title').textContent=item?'Editar registro':`Nuevo ${tipo}`;document.getElementById('save-button').textContent=item?'Guardar cambios':`Crear ${tipo}`;if(item)Object.entries(item).forEach(([key,value])=>{const input=form.elements.namedItem(key);if(input)input.value=value??'';});panel.hidden=false;document.getElementById('new-button').setAttribute('aria-expanded','true');panel.scrollIntoView({behavior:'smooth',block:'start'});fields.querySelector('input,textarea')?.focus();}
document.getElementById('new-button').addEventListener('click',()=>openForm());document.getElementById('cancel-button').addEventListener('click',()=>{panel.hidden=true;document.getElementById('new-button').setAttribute('aria-expanded','false');});
search.addEventListener('input',draw);document.getElementById('search-form').addEventListener('submit',e=>e.preventDefault());
rows.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const id=Number(edit.dataset.edit);openForm(data.find(x=>(tipo==='autor'?x.idAutor:x.idEditorial)===id));}if(del){const id=del.dataset.delete,item=data.find(x=>String(tipo==='autor'?x.idAutor:x.idEditorial)===id),name=tipo==='autor'?`${item.nombres} ${item.apellidos}`:item.nombre;if(!confirm(`¿Eliminar «${name}»?`))return;del.disabled=true;try{const r=await fetch(`${api}/${id}`,{method:'DELETE'});if(!r.ok)throw Error(await apiError(r));showNotice(`Se eliminó «${name}».`,'success');await load();}catch(err){showNotice(`No se pudo eliminar «${name}». Puede tener libros asociados. ${err.message}`,'danger');del.disabled=false;}}});
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const payload=Object.fromEntries(new FormData(form));Object.keys(payload).forEach(k=>{if(payload[k]==='')payload[k]=null});const id=editing&&(tipo==='autor'?editing.idAutor:editing.idEditorial);const button=document.getElementById('save-button');button.disabled=true;try{const r=await fetch(id?`${api}/${id}`:api,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error(await apiError(r));panel.hidden=true;document.getElementById('new-button').setAttribute('aria-expanded','false');showNotice(id?'Cambios guardados.':'Registro creado.','success');await load();}catch(err){showNotice(`No se pudo guardar el registro. ${err.message}`,'danger');}finally{button.disabled=false;}});
buildFields();
const editId=new URLSearchParams(location.search).get('editar');
load().then(()=>{if(editId){const found=data.find(x=>String(tipo==='autor'?x.idAutor:x.idEditorial)===editId);if(found)openForm(found);}});
</script>
</body></html>
