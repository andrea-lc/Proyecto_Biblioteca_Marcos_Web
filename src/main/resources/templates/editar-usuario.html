<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Editar usuario | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body><header class="navbar bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/dashboard}">Bibliot.</a><a class="nav-link text-dark" th:href="@{/usuarios/detalle}">Volver al perfil</a></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-8"><p class="text-secondary mb-1">Usuarios / Emeto Mamani</p><h1 class="h2 mb-4">Editar usuario</h1><div class="alert alert-info" role="status">Los cambios no se guardarán: la edición todavía no está conectada.</div><form th:action="@{/usuarios/editar}" method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><label for="displayName" class="form-label">Nombre para mostrar</label><input class="form-control" id="displayName" name="nombreVisible" value="Emeto Mamani" required></div><div class="col-md-6"><label for="fullName" class="form-label">Nombre completo</label><input class="form-control" id="fullName" name="nombreCompleto" value="Emeto Winner Montes" required></div><div class="col-12"><label for="email" class="form-label">Correo electrónico</label><input class="form-control" id="email" name="correo" type="email" value="lector@ejemplo.com" required></div><div class="col-md-6"><label for="role" class="form-label">Rol</label><select class="form-select" id="role" name="rol"><option>Lector</option><option>Personal de biblioteca</option></select></div><div class="col-md-6"><label for="state" class="form-label">Estado</label><select class="form-select" id="state" name="estado"><option>Activo</option><option>Inactivo</option></select></div></div></div><div class="card-footer bg-white border-0 d-flex justify-content-end gap-2 p-4"><a class="btn btn-outline-secondary" th:href="@{/usuarios/detalle}">Cancelar</a><button class="btn btn-secondary" type="button" disabled>Guardar cambios</button></div></form></div></div></main>
</body>
</html>
