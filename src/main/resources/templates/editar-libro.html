<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Editar libro | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body><header class="navbar bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/dashboard}">Bibliot.</a><a class="nav-link text-dark" th:href="@{/libros}">Volver a libros</a></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-9"><p class="text-secondary mb-1">Catálogo / La Odisea</p><h1 class="h2 mb-4">Editar libro</h1><div class="alert alert-info" role="status">Los cambios no se guardarán: la edición todavía no está conectada.</div><form th:action="@{/libros/editar}" method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3"><div class="col-12"><label for="title" class="form-label">Título</label><input class="form-control" id="title" name="titulo" value="La Odisea" required></div><div class="col-md-6"><label for="author" class="form-label">Autor</label><input class="form-control" id="author" name="autor" value="Homero"></div><div class="col-md-6"><label for="category" class="form-label">Categoría</label><select class="form-select" id="category" name="categoria"><option>Literatura clásica</option><option>Infantil y juvenil</option><option>Historia</option></select></div><div class="col-md-4"><label for="format" class="form-label">Formato</label><select class="form-select" id="format" name="formato"><option>Físico</option><option>Digital</option></select></div><div class="col-md-4"><label for="copies" class="form-label">Ejemplares</label><input class="form-control" id="copies" name="ejemplares" type="number" min="0" value="4"></div><div class="col-md-4"><label for="status" class="form-label">Disponibilidad</label><select class="form-select" id="status" name="estado"><option>Disponible</option><option>No disponible</option></select></div><div class="col-12"><label for="description" class="form-label">Descripción</label><textarea class="form-control" id="description" name="descripcion" rows="4">Una obra clásica de la literatura griega.</textarea></div></div></div><div class="card-footer bg-white border-0 d-flex justify-content-end gap-2 p-4"><a class="btn btn-outline-secondary" th:href="@{/libros}">Cancelar</a><button class="btn btn-secondary" type="button" disabled>Guardar cambios</button></div></form></div></div></main>
</body>
</html>
