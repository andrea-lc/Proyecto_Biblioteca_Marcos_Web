<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Nuevo usuario | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body><header class="navbar bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/dashboard}">Bibliot.</a><a class="nav-link text-dark" th:href="@{/usuarios}">Volver a usuarios</a></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-8"><p class="text-secondary mb-1">Administración</p><h1 class="h2 mb-4">Nuevo usuario</h1><div class="alert alert-info" role="status">El alta de usuarios todavía no está conectada; el formulario es una maqueta.</div><form th:action="@{/usuarios/nuevo}" method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><label for="firstName" class="form-label">Nombres</label><input class="form-control" id="firstName" name="nombres" autocomplete="given-name" required></div><div class="col-md-6"><label for="lastName" class="form-label">Apellidos</label><input class="form-control" id="lastName" name="apellidos" autocomplete="family-name" required></div><div class="col-12"><label for="email" class="form-label">Correo electrónico</label><input class="form-control" id="email" name="correo" type="email" autocomplete="email" required></div><div class="col-md-6"><label for="role" class="form-label">Rol</label><select id="role" name="rol" class="form-select"><option value="" selected>Seleccionar rol</option><option>Lector</option><option>Personal de biblioteca</option></select></div><div class="col-md-6"><label for="state" class="form-label">Estado</label><select id="state" name="estado" class="form-select"><option>Activo</option><option>Inactivo</option></select></div></div></div><div class="card-footer bg-white border-0 d-flex justify-content-end gap-2 p-4"><a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-secondary" type="button" disabled>Crear usuario</button></div></form></div></div></main>
</body>
</html>
