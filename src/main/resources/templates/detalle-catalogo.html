<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base th:href="@{/}"><script th:replace="~{auth :: auth}"></script>
    <title th:text="${tipo == 'autor' ? 'Detalle del autor | Bibliot.' : 'Detalle de la editorial | Bibliot.'}">Detalle | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,admin_panel_settings,arrow_back,business,edit_note,groups,home,logout,menu_book,notifications,query_stats,settings,swap_horiz"><link rel="stylesheet" href="./css/bibliot.css">
</head>
<body class="admin-body"><div class="admin-layout">
<aside th:replace="~{admin-sidebar :: sidebar(${tipo == 'autor' ? 'autores' : 'editoriales'})}" class="admin-sidebar"></aside>
<main class="admin-main"><header class="admin-topbar"><a class="ed-topbar-back" th:href="${tipo == 'autor' ? '/autores' : '/editoriales'}"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span><span th:text="${tipo == 'autor' ? 'Volver a autores' : 'Volver a editoriales'}">Volver al listado</span></a><div class="topbar-actions"><button class="round-action" type="button" aria-label="Notificaciones"><span class="material-symbols-outlined" aria-hidden="true">notifications</span></button><a class="round-action user-action" th:href="@{/perfil}" aria-label="Mi cuenta"><span class="material-symbols-outlined" aria-hidden="true">account_circle</span></a></div></header>
<section class="users-content"><nav class="ed-breadcrumb" aria-label="Migas de pan"><a th:href="${tipo == 'autor' ? '/autores' : '/editoriales'}" th:text="${tipo == 'autor' ? 'Autores' : 'Editoriales'}">Registros</a><span aria-hidden="true">/</span><span aria-current="page">Detalle</span></nav>
    <div class="ed-page-header ed-enter"><div><h1 class="page-heading" id="record-name">Cargando detalle…</h1><p class="ed-page-subtitle" id="record-meta"></p></div><div class="d-flex gap-2"><button class="btn btn-brand" id="edit-button" type="button" disabled>Editar</button></div></div>
    <div class="alert alert-info ed-notice py-2 mb-4" id="detail-message" role="status" aria-live="polite">Cargando información…</div>
    <section class="ed-card p-4 mb-4 ed-enter" data-stagger="1" id="bio-section" hidden><h2 class="ed-card-title mb-2">Biografía</h2><p id="bio" class="ed-prose mb-0"></p></section>
    <div class="ed-card-header ed-enter" data-stagger="2"><h2 class="ed-card-title" id="associated-books-heading">Libros asociados</h2><span class="ed-card-meta" id="book-count"></span></div>
    <div class="table-responsive users-table-wrap ed-table-wrap ed-enter" data-stagger="2" tabindex="0" role="region" aria-labelledby="associated-books-heading"><table class="table users-table ed-table table-hover align-middle mb-0"><caption class="visually-hidden">Libros asociados a este registro</caption><thead><tr><th scope="col">Título</th><th scope="col">ISBN</th><th scope="col">Editorial</th><th scope="col">Estado</th></tr></thead><tbody id="book-rows"><tr><td colspan="4" class="py-3"><span class="ed-skeleton ed-skeleton--row" aria-hidden="true"></span></td></tr></tbody></table></div>
</section></main></div>
<script th:inline="javascript">
const tipo = /*[[${tipo}]]*/ 'autor';
const id = /*[[${registroId}]]*/ 0;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const adminAutoresApi = /*[[@{/api/admin/autores}]]*/ '/api/admin/autores';
const adminEditorialesApi = /*[[@{/api/admin/editoriales}]]*/ '/api/admin/editoriales';
const biblioAutoresApi = /*[[@{/api/bibliotecario/autores}]]*/ '/api/bibliotecario/autores';
const biblioEditorialesApi = /*[[@{/api/bibliotecario/editoriales}]]*/ '/api/bibliotecario/editoriales';
const adminLibrosApi = /*[[@{/api/admin/libros}]]*/ '/api/admin/libros';
const biblioLibrosApi = /*[[@{/api/bibliotecario/libros}]]*/ '/api/bibliotecario/libros';
const esAdministrador = Auth.hasRole(['ADMINISTRADOR']);
const adminApi = tipo === 'autor' ? adminAutoresApi : adminEditorialesApi;
const biblioApi = tipo === 'autor' ? biblioAutoresApi : biblioEditorialesApi;
const api = esAdministrador ? adminApi : biblioApi;
const booksApi = esAdministrador ? adminLibrosApi : biblioLibrosApi;
const name=document.getElementById('record-name'), meta=document.getElementById('record-meta'), message=document.getElementById('detail-message'), rows=document.getElementById('book-rows');
async function err(res){const t=await res.text();try{const j=JSON.parse(t);return j.message||j.detail||j.error||t;}catch{return t||`Error HTTP ${res.status}`;}}
async function load(){try{const [recordRes,booksRes]=await Promise.all([fetch(`${api}/${id}`,{headers:{Accept:'application/json'}}),fetch(booksApi,{headers:{Accept:'application/json'}})]);if(!recordRes.ok)throw Error(await err(recordRes));if(!booksRes.ok)throw Error(await err(booksRes));const record=await recordRes.json(),books=await booksRes.json();const author=tipo==='autor';name.textContent=author?`${record.nombres} ${record.apellidos}`:record.nombre;meta.textContent=author?(record.nacionalidad||'Nacionalidad no indicada'):[record.pais,record.sitioWeb].filter(Boolean).join(' · ')||'Información editorial';if(author&&record.biografia){document.getElementById('bio').textContent=record.biografia;document.getElementById('bio-section').hidden=false;}
const related=books.filter(b=>author?(b.autorIds||[]).includes(Number(id)):Number(b.idEditorial)===Number(id));document.getElementById('book-count').textContent=`${related.length} ${related.length===1?'libro':'libros'}`;rows.replaceChildren();if(!related.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='text-center py-5 text-secondary';td.textContent='Este registro todavía no tiene libros asociados.';tr.append(td);rows.append(tr);}else related.forEach(book=>{const tr=document.createElement('tr');const bookHref=`/libros/editar?id=${encodeURIComponent(book.idLibro)}`;tr.innerHTML=`<td><a class="fw-semibold link-dark text-decoration-none" href="${bookHref}">${esc(book.titulo||'Sin título')}</a></td><td>${esc(book.isbn)||'—'}</td><td>${esc(book.editorial?.nombre)||'—'}</td><td><span class="ed-badge ${book.estado==='Disponible'?'ed-badge--success':'ed-badge--neutral'}">${esc(book.estado)||'Sin estado'}</span></td>`;rows.append(tr);});message.hidden=true;const editButton=document.getElementById('edit-button');editButton.disabled=false;if(Auth.hasRole(['ADMINISTRADOR']))editButton.addEventListener('click',()=>location.href=`/${author?'autores':'editoriales'}?editar=${id}`);else editButton.hidden=true;}catch(e){message.className='alert alert-danger';message.textContent=`No se pudo cargar el detalle. ${e.message}`;rows.innerHTML='<tr><td colspan="4" class="text-center py-5">Vuelve al listado e inténtalo de nuevo.</td></tr>';}}
load();
</script></body></html>
