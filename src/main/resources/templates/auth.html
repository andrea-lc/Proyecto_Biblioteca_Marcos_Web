<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragmento de autenticación</title></head>
<body>
<script th:fragment="auth" th:inline="none">
    (function () {
        'use strict';

        var TOKEN_KEY = 'bibliot.token';

        // Context path (sale del <base th:href="@{/}"> de cada plantilla)
        var baseEl = document.querySelector('base[href]');
        var ctx = '';
        try {
            ctx = new URL(baseEl ? baseEl.href : '/', location.href).pathname.replace(/\/+$/, '');
        } catch (e) {
            ctx = '';
        }

        // ---- Token ----
        function getToken() {
            try {
                return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
            } catch (e) {
                return null;
            }
        }

        function setToken(token, remember) {
            clearToken();
            try {
                (remember ? localStorage : sessionStorage).setItem(TOKEN_KEY, token);
            } catch (e) {
            }
        }

        function clearToken() {
            try {
                localStorage.removeItem(TOKEN_KEY);
            } catch (e) {
            }
            try {
                sessionStorage.removeItem(TOKEN_KEY);
            } catch (e) {
            }
        }

        // Lee el payload del JWT (no valida la firma: eso lo hace el backend)
        function decode(token) {
            try {
                var part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                while (part.length % 4) part += '=';
                var bytes = Uint8Array.from(atob(part), function (c) {
                    return c.charCodeAt(0);
                });
                return JSON.parse(new TextDecoder('utf-8').decode(bytes));
            } catch (e) {
                return null;
            }
        }

        // { email, rol, uid, nombre, exp } o null si no hay sesión válida
        function user() {
            var token = getToken();
            if (!token) return null;
            var p = decode(token);
            if (!p || (p.exp && p.exp * 1000 <= Date.now())) {
                clearToken();
                return null;
            }
            return {
                email: p.sub, rol: String(p.rol || '').toUpperCase(), uid: p.uid || null,
                nombre: p.nombre || p.sub, exp: p.exp
            };
        }

        function hasRole(roles) {
            var u = user();
            if (!u) return false;
            if (!roles || !roles.length || roles.indexOf('*') >= 0) return true;
            return roles.indexOf(u.rol) >= 0;
        }

        function homeFor(rol) {
            rol = String(rol || '').trim().toUpperCase();
            return (
                rol === 'ADMINISTRADOR' ||
                rol === 'BIBLIOTECARIO'
            )
                ? ctx + '/dashboard'
                : ctx + '/index';
        }

        function logout() {
            clearToken();
            location.replace(ctx + '/login');
        }

        // ---- Reglas de acceso por página ('*' = cualquier usuario con sesión) ----
        var RULES = [
            {path: '/dashboard', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO']},
            {path: '/usuarios/nuevo', roles: ['ADMINISTRADOR']},
            {path: '/usuarios/editar', roles: ['ADMINISTRADOR']},
            {path: '/usuarios', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO'], prefix: true},
            {path: '/libros', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO'], prefix: true},
            {path: '/prestamos', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO'], prefix: true},
            {path: '/autores', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO'], prefix: true},
            {path: '/editoriales', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO'], prefix: true},
            {path: '/roles', roles: ['ADMINISTRADOR', 'BIBLIOTECARIO']},
            {path: '/configuracion', roles: ['ADMINISTRADOR']},

            {path: '/perfil', roles: ['*']},
            {path: '/mis-prestamos', roles: ['*']},
            {path: '/notificaciones', roles: ['*']},
            {path: '/lector-digital', roles: ['*']},
            {path: '/confirmacion-reserva', roles: ['*']}
        ];

        function currentRoute() {
            var p = location.pathname;
            if (ctx && p.indexOf(ctx) === 0) p = p.slice(ctx.length);
            p = p.replace(/\/+$/, '').toLowerCase();
            return p || '/';
        }

        function ruleForPage() {
            var route = currentRoute();
            for (var i = 0; i < RULES.length; i++) {
                var r = RULES[i];
                if (route === r.path || (r.prefix && route.indexOf(r.path + '/') === 0)) return r;
            }
            return null;
        }

        function goLogin() {
            location.replace(ctx + '/login?next=' + encodeURIComponent(location.pathname + location.search));
        }

        function guardPage() {
            var rule = ruleForPage();
            if (!rule) return;
            if (!user()) {
                goLogin();
                return;
            }
            if (!hasRole(rule.roles)) location.replace(ctx + '/acceso-denegado');
        }

        // ---- fetch con Authorization automático (la pieza clave) ----

// ---- fetch con Authorization automático ----
        var nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
            var isApi = false;

            try {
                var inputUrl = typeof input === 'string'
                    ? input
                    : (input instanceof URL ? input.href : input.url);

                var target = new URL(inputUrl, window.location.href);

                isApi = target.origin === window.location.origin
                    && (target.pathname.indexOf(ctx + '/api/') === 0
                        || target.pathname.indexOf(ctx + '/actuator/') === 0);

            } catch (e) {
                console.error('Error identificando la petición:', e);
            }

            var token = isApi ? getToken() : null;

            if (token) {
                init = init || {};

                var headers = new Headers(
                    init.headers ||
                    (typeof input !== 'string' && !(input instanceof URL)
                        ? input.headers
                        : undefined)
                );

                if (!headers.has('Authorization')) {
                    headers.set('Authorization', 'Bearer ' + token);
                }

                init.headers = headers;
            }

            return nativeFetch(input, init).then(function (res) {
                if (isApi) {
                    if (res.status === 401) {
                        if (token) clearToken();
                        if (ruleForPage()) goLogin();
                    } else if (res.status === 403 && ruleForPage()) {
                        window.location.replace(ctx + '/acceso-denegado');
                    }
                }

                return res;
            });
        };

        // ---- Mostrar / ocultar elementos según sesión y rol ----
        var style = document.createElement('style');
        style.textContent =
            'html.auth-pending [data-auth-show],html.auth-pending [data-roles]{display:none!important}' +
            '[data-auth-hidden]{display:none!important}';
        document.head.appendChild(style);
        document.documentElement.classList.add('auth-pending');

        function applyUi() {
            var u = user();
            document.querySelectorAll('[data-auth-show]').forEach(function (el) {
                var show = el.getAttribute('data-auth-show') === 'user' ? !!u : !u;
                el.toggleAttribute('data-auth-hidden', !show);
            });
            document.querySelectorAll('[data-roles]').forEach(function (el) {
                var roles = el.getAttribute('data-roles').split(',').map(function (r) {
                    return r.trim().toUpperCase();
                });
                el.toggleAttribute('data-auth-hidden', !(u && roles.indexOf(u.rol) >= 0));
            });
            document.querySelectorAll('[data-user-name]').forEach(function (el) {
                el.textContent = u ? u.nombre : '';
            });
            document.querySelectorAll('[data-logout], .signout-link').forEach(function (el) {
                el.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    logout();
                });
            });
            activarNotificaciones();
            document.documentElement.classList.remove('auth-pending');
            document.documentElement.classList.remove('auth-pending');
        }

        function activarNotificaciones() {
            if (!user() || window.__bibliotNotificationsStarted) return;
            window.__bibliotNotificationsStarted = true;
            var api = ctx + '/api/notificaciones';
            var badgeStyle = document.createElement('style');
            badgeStyle.textContent = '.bibliot-notification-count{position:absolute;top:-.25rem;right:-.35rem;min-width:1.2rem;height:1.2rem;padding:0 .25rem;border-radius:999px;background:#a83232;color:#fff;font:600 .7rem/1.2rem system-ui;text-align:center;z-index:2}';
            document.head.appendChild(badgeStyle);
            var selectors = 'a[href$="/notificaciones"],button[aria-label="Notificaciones"]';
            var dialog = document.createElement('dialog');
            dialog.id = 'bibliot-notifications-dialog';
            dialog.setAttribute('closedby', 'any');
            dialog.setAttribute('aria-labelledby', 'bibliot-notifications-title');
            dialog.className = 'bibliot-notifications-dialog';
            dialog.innerHTML = '<header class="bibliot-notifications-header"><div><h1 id="bibliot-notifications-title">Notificaciones</h1><p>Actualizaciones de libros y préstamos</p></div><form method="dialog"><button type="submit" class="bibliot-notifications-close" autofocus>Cerrar</button></form></header><p id="bibliot-notifications-status" class="bibliot-notifications-status" role="status" aria-live="polite">Cargando notificaciones…</p><div id="bibliot-notifications-list" class="bibliot-notifications-list"></div>';
            document.body.appendChild(dialog);
            var status = dialog.querySelector('#bibliot-notifications-status');
            var list = dialog.querySelector('#bibliot-notifications-list');
            function abrirDialogo(event) {
                if (event) event.preventDefault();
                if (!dialog.open) dialog.showModal();
                cargarNotificaciones();
            }
            document.querySelectorAll(selectors).forEach(function (control) {
                if (control.hasAttribute('data-notification-bound')) return;
                control.setAttribute('data-notification-bound', '');
                control.addEventListener('click', abrirDialogo);
            });
            if (!('closedBy' in HTMLDialogElement.prototype)) {
                var presionoFuera = false;
                var estaFuera = function (event) {
                    var rect = dialog.getBoundingClientRect();
                    return event.clientX < rect.left || event.clientX > rect.right
                        || event.clientY < rect.top || event.clientY > rect.bottom;
                };
                dialog.addEventListener('pointerdown', function (event) { presionoFuera = estaFuera(event); });
                dialog.addEventListener('pointerup', function (event) {
                    if (presionoFuera && estaFuera(event) && dialog.open) dialog.close();
                    presionoFuera = false;
                });
            }
            function pintarLista(items) {
                list.replaceChildren();
                status.hidden = items.length > 0;
                status.className = 'bibliot-notifications-status';
                if (!items.length) {
                    status.textContent = 'No tienes notificaciones.';
                    return;
                }
                items.forEach(function (item) {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'bibliot-notification-item' + (item.leida ? '' : ' is-unread');
                    button.setAttribute('aria-label', (item.leida ? '' : 'No leída. ') + item.titulo + '. ' + item.mensaje);
                    var title = document.createElement('strong');
                    title.textContent = item.titulo;
                    var message = document.createElement('span');
                    message.textContent = item.mensaje;
                    var date = document.createElement('time');
                    date.dateTime = item.fechaCreacion;
                    date.textContent = new Date(item.fechaCreacion).toLocaleString('es-CO');
                    button.append(title, message, date);
                    button.addEventListener('click', async function () {
                        if (!item.leida) {
                            button.disabled = true;
                            try {
                                var readResponse = await window.fetch(api + '/' + item.id + '/leida', { method: 'POST' });
                                if (!readResponse.ok) throw new Error('No se pudo marcar como leída.');
                                item.leida = true;
                                window.dispatchEvent(new CustomEvent('bibliot-notifications-refresh'));
                            } catch (error) {
                                status.hidden = false;
                                status.className = 'bibliot-notifications-status is-error';
                                status.textContent = error.message;
                                button.disabled = false;
                                return;
                            }
                        }
                        if (item.urlDestino) {
                            var destino = new URL(item.urlDestino, location.origin);
                            if (destino.origin === location.origin) location.assign(destino.href);
                        } else cargarNotificaciones();
                    });
                    list.appendChild(button);
                });
            }
            async function cargarNotificaciones() {
                status.hidden = false;
                status.className = 'bibliot-notifications-status';
                status.textContent = 'Cargando notificaciones…';
                try {
                    var response = await window.fetch(api, { headers: { Accept: 'application/json' } });
                    if (!response.ok) throw new Error('No se pudieron cargar las notificaciones.');
                    pintarLista(await response.json());
                } catch (error) {
                    status.hidden = false;
                    status.className = 'bibliot-notifications-status is-error';
                    status.textContent = error.message;
                }
            }
            window.addEventListener('bibliot-notifications-refresh', function () {
                actualizar();
                if (dialog.open) cargarNotificaciones();
            });
            function pintarContador(count) {
                document.querySelectorAll(selectors).forEach(function (control) {
                    var badge = control.querySelector('[data-notification-count]');
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.setAttribute('data-notification-count', '');
                        badge.className = 'bibliot-notification-count';
                        badge.setAttribute('aria-live', 'polite');
                        control.appendChild(badge);
                    }
                    badge.textContent = count > 99 ? '99+' : String(count);
                    badge.hidden = !count;
                    control.style.position = 'relative';
                });
            }
            function actualizar() {
                return window.fetch(api + '/no-leidas', { headers: { Accept: 'application/json' } })
                    .then(function (r) { if (!r.ok) throw new Error('No se pudo leer el contador'); return r.json(); })
                    .then(pintarContador).catch(function () {});
            }
            actualizar();
            (async function conectar() {
                var espera = 1000;
                while (user()) {
                    try {
                        var response = await window.fetch(api + '/stream', { headers: { Accept: 'text/event-stream' } });
                        if (!response.ok || !response.body) throw new Error('Stream no disponible');
                        espera = 1000;
                        var reader = response.body.getReader();
                        var decoder = new TextDecoder();
                        var buffer = '';
                        while (user()) {
                            var chunk = await reader.read();
                            if (chunk.done) break;
                            buffer += decoder.decode(chunk.value, { stream: true });
                            var frames = buffer.split(/\r?\n\r?\n/);
                            buffer = frames.pop() || '';
                            frames.forEach(function (frame) {
                                if (frame.indexOf('event: notification') >= 0) {
                                    window.dispatchEvent(new CustomEvent('bibliot-notifications-refresh'));
                                }
                            });
                        }
                    } catch (error) {
                        await new Promise(function (resolve) { setTimeout(resolve, espera); });
                        espera = Math.min(espera * 2, 30000);
                    }
                }
            })();
        }

        guardPage();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyUi);
        else applyUi();

        window.Auth = {
            getToken: getToken, setToken: setToken, clear: clearToken,
            user: user, hasRole: hasRole, homeFor: homeFor, logout: logout, ctx: ctx
        };
    })();
</script>
</body>
</html>
