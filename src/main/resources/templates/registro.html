<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/bibliot.css?v=7">
</head>
<body class="auth-page">
<main class="container-fluid p-0">
    <div class="row g-0 auth-shell">
        <section class="col-md-6 photo-panel auth-register-photo" aria-label="Estantería de libros">
            <div class="photo-copy">
                <h1>Únete a nuestra<br>comunidad lectora</h1>
                <p>Regístrate y accede a un mundo de historias.</p>
            </div>
        </section>
        <section class="col-md-6 form-panel">
            <div class="auth-card">
                <header class="text-center mb-3">
                    <div class="brand">Bibliot.</div>
                    <div class="tagline">Lee · Explora · Descubre</div>
                </header>
                <h2 class="h5 mb-1">Crear cuenta</h2>
                <p class="text-secondary small mb-3">Completa tus datos para comenzar.</p>
                <div class="alert alert-info py-2 small" role="status" th:if="${formMessage}" th:text="${formMessage}"></div>
                <form th:action="@{/registro}" method="post">
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-person"></i></span><input class="form-control" type="text" name="nombres" autocomplete="name" placeholder="Nombres y apellidos" aria-label="Nombres y apellidos" required></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-card-text"></i></span><input class="form-control" type="text" name="dni" inputmode="numeric" placeholder="DNI" aria-label="DNI" required></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-envelope"></i></span><input class="form-control" type="email" name="correo" autocomplete="email" placeholder="Correo electrónico" aria-label="Correo electrónico" required></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-telephone"></i></span><input class="form-control" type="tel" name="telefono" autocomplete="tel" placeholder="Teléfono" aria-label="Teléfono"></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-geo-alt"></i></span><input class="form-control" type="text" name="direccion" autocomplete="street-address" placeholder="Dirección" aria-label="Dirección"></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-lock"></i></span><input class="form-control" type="password" name="password" autocomplete="new-password" placeholder="Contraseña" aria-label="Contraseña" required></div>
                    <div class="input-group mb-2"><span class="input-group-text bg-transparent" aria-hidden="true"><i class="bi bi-lock-fill"></i></span><input class="form-control" type="password" name="confirmarPassword" autocomplete="new-password" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required></div>
                    <div class="form-check small mb-2"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">Acepto los <a href="#terminos" class="link-primary">Términos y condiciones</a></label></div>
                    <button class="btn btn-brand w-100" type="submit">Registrarme</button>
                </form>
                <p class="text-center small mt-2 mb-0">¿Ya tienes una cuenta? <a th:href="@{/login}" class="link-primary ms-1">Inicia sesión</a></p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
