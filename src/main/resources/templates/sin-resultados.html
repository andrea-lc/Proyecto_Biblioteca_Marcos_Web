<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <script th:replace="~{auth :: auth}"></script>
    <title>Sin resultados | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,search_off">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body class="ed-portal-page">
<header class="navbar ed-portal-navbar"><div class="container"><a class="navbar-brand" th:href="@{/index}">Bibliot.</a><a class="nav-link" th:href="@{/explorar}">Explorar</a></div></header>
<main class="ed-portal-main">
    <div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <section class="ed-portal-empty-card ed-enter" aria-labelledby="no-results-title">
                <div class="ed-portal-empty-icon" aria-hidden="true"><span class="material-symbols-outlined">search_off</span></div>
                <h1 id="no-results-title">No encontramos libros</h1>
                <p>Prueba con otro título, autor o categoría. También puedes limpiar los filtros para explorar todo el catálogo.</p>
                <form class="row g-2 justify-content-center" th:action="@{/explorar}" method="get" role="search">
                    <div class="col-12 col-sm-8">
                        <label for="q" class="visually-hidden">Buscar otro libro</label>
                        <input class="form-control" id="q" name="q" type="search" placeholder="Buscar por título o autor">
                    </div>
                    <div class="col-12 col-sm-auto">
                        <button class="btn btn-brand w-100" type="submit"><span class="material-symbols-outlined" aria-hidden="true">search</span>Buscar</button>
                    </div>
                </form>
                <a class="d-inline-block mt-4 link-secondary" th:href="@{/explorar}">Quitar filtros y volver a explorar</a>
            </section>
        </div>
    </div>
    </div>
</main>
</body>
</html>
