<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <base th:href="@{/}">
    <title>Sin resultados | Bibliot.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bibliot.css">
</head>
<body><header class="navbar bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/index}">Bibliot.</a><a class="nav-link text-dark" th:href="@{/explorar}">Explorar</a></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><p class="text-secondary mb-1">Catálogo</p><h1 class="h2 mb-3">No encontramos libros</h1><p class="text-secondary">Prueba con otro título, autor o categoría. También puedes quitar algunos filtros.</p><form class="row g-2" th:action="@{/explorar}" method="get" role="search"><div class="col-12 col-sm"><label for="q" class="visually-hidden">Buscar otro libro</label><input class="form-control" id="q" name="q" type="search" placeholder="Buscar por título o autor"></div><div class="col-12 col-sm-auto"><button class="btn btn-secondary w-100" type="submit">Buscar</button></div></form><a class="d-inline-block mt-3 link-secondary" th:href="@{/explorar}">Quitar filtros y volver a explorar</a></div></div></div></div></main>
</body>
</html>
